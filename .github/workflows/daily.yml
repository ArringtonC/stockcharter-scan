name: daily scan

on:
  schedule:
    # BACKSTOP ONLY -- for when the Mac is off. Measured on six scheduled runs,
    # this cron fired 124 to 228 minutes late EVERY time; GitHub's scheduler is
    # best-effort on public repos and the top of the hour is the worst slot. The
    # real schedule is launchd on the Mac (run_local.sh). Hourly here would only
    # queue up runs that arrive hours after they are useful, so it is twice a day
    # on an odd minute.
    - cron: '23 12 * * 1-5'
    - cron: '23 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run the scan
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          SCHWAB_KEY: ${{ secrets.SCHWAB_KEY }}
          SCHWAB_SECRET: ${{ secrets.SCHWAB_SECRET }}
          SCHWAB_REFRESH: ${{ secrets.SCHWAB_REFRESH }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python3 scan_daily.py
      - name: commit
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/ trades.csv
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%d\ %H:%M)"
          git push
