name: daily scan

on:
  schedule:
    - cron: '15 13 * * 1-5'   # 08:15 Central, before the open
    - cron: '15 21 * * 1-5'   # 16:15 Eastern, after the close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run the scan
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python3 scan_daily.py
      - name: commit
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/ trades.csv
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%d\ %H:%M)"
          git push
