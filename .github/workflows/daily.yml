name: daily scan

on:
  schedule:
    # Hourly across your window. 12:00-21:00 UTC is 07:00-16:00 Central while
    # daylight time is on, 06:00-15:00 after it ends -- GitHub cron is UTC only
    # and does not shift. The 21:30 run is the one after the close.
    - cron: '0 12-21 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run the scan
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          SCHWAB_KEY: ${{ secrets.SCHWAB_KEY }}
          SCHWAB_SECRET: ${{ secrets.SCHWAB_SECRET }}
          SCHWAB_REFRESH: ${{ secrets.SCHWAB_REFRESH }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python3 scan_daily.py
      - name: commit
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add docs/ trades.csv
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%d\ %H:%M)"
          git push
