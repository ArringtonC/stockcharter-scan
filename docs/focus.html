<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ledger.css">
<style>
.wrap{max-width:1280px;margin:0 auto;padding:var(--s4) 16px 96px}
.back{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim);text-decoration:none}
h1{font:300 clamp(32px,7vw,48px)/1.05 var(--serif);margin:var(--s3) 0 var(--s2)}
h2{font:600 var(--t-h2) var(--mono);margin:0}
.sub{color:var(--dim);font-size:var(--t-data)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.chips button,.pills button,.modes button{background:var(--bg2);color:var(--ink2);border:1px solid var(--line2);padding:6px 12px;font:600 var(--t-data) var(--mono);cursor:pointer}
.chips button.on,.pills button.on,.modes button.on{color:var(--amber);border-color:var(--amber)}
.pills button,.modes button{font-weight:500;font-size:var(--t-label);letter-spacing:var(--tr);padding:4px 10px}
.panel{border:1px solid var(--line);background:var(--panel);padding:14px 16px}
.ctl{display:grid;gap:12px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.row .lbl{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim);min-width:110px}
.row label{font-size:var(--t-data);color:var(--ink2);display:flex;gap:6px;align-items:center;cursor:pointer}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.tile{border:1px solid var(--line);padding:8px 10px}
.tile .k{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.tile .v{font:600 var(--t-h2) var(--mono);margin-top:2px}
.up{color:var(--up)}.dn{color:var(--dn)}.nt{color:var(--dim)}
.main{display:grid;gap:16px;grid-template-columns:7fr 3fr}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.chhd{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:var(--t-label);color:var(--dim);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.chart{height:520px;background:var(--bg)}
@media(max-width:600px){.chart{height:380px}}
.chartwrap{position:relative}
.react{border:1px solid var(--amber);padding:10px 12px;margin-top:10px;display:none;font-size:var(--t-data)}
.react.on{display:block}
.react h4{font:600 var(--t-data) var(--mono);margin:0 0 6px}
.react .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin:6px 0}
.react .g div{border:1px solid var(--line);padding:6px 8px}.react .g .k{font:500 var(--t-label) var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:var(--tr)}.react .g .v{font:600 var(--t-body) var(--mono)}
.feed{max-height:640px;overflow:auto;display:grid;gap:8px;align-content:start}
.card{border:1px solid var(--line);padding:10px 12px;cursor:pointer;background:var(--bg2)}
.card:hover{border-color:var(--line2)}.card.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.card h3{font:600 var(--t-body) var(--mono);margin:0 0 4px;line-height:1.35}
.card p{margin:0 0 6px;color:var(--ink2);font-size:var(--t-data);line-height:1.45}
.card .m{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:var(--t-label);color:var(--dim);align-items:center}
.card .m i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.badge{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;border:1px solid var(--line2);padding:1px 6px;color:var(--ink2);float:right;margin-left:8px}
.card a{color:var(--ink);text-decoration:none}.card a:hover{text-decoration:underline}
.strip{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:16px}
.strip h3{font:600 var(--t-data) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;margin:0 0 8px}
.strip .big{font:600 clamp(20px,3vw,26px)/1 var(--mono);margin:2px 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:var(--t-data)}
.kv span:nth-child(odd){color:var(--dim)}
.scrub{width:100%;accent-color:var(--amber);margin:4px 0 0}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:300px;background:var(--panel);border:1px solid var(--line2);padding:8px 10px;font-size:var(--t-data);box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;line-height:1.4}
.tip b{font-weight:600}.tip .n{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.tip .n div{margin-top:4px}.tip .n i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.tip small{color:var(--dim)}
.defs{font-size:var(--t-label);color:var(--dim);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← Ledger</a>
<h1>Focus</h1>
<p class="sub" id="meta">Loading…</p>
<div class="chips" id="chips"></div>
<div class="strip">
  <div class="panel" id="read"></div>
  <div class="panel" id="risk"></div>
  <div class="panel" id="cond"></div>
</div>
<div class="panel ctl">
  <div class="row"><span class="lbl">Timeline</span><span class="modes" id="ranges"></span><span class="sub" id="span"></span></div>
  <div class="row"><span class="lbl">Position</span><input type="range" class="scrub" id="scrub" min="0" max="100" value="100" style="flex:1"></div>
  <div class="row"><span class="lbl">Move score</span><span class="modes" id="scores"><button data-s="8" class="on">8–10 only</button><button data-s="0">All</button></span><span class="sub">score = size of the market's move that day: 5 + 2 × |day %|, capped at 10. A 10 is a 2.5% day or bigger.</span></div>
  <div class="row"><span class="lbl">Events</span><span class="pills" id="pills"></span></div>
  <div class="row"><span class="lbl">Show</span><span class="row" id="show">
    <label><input type="checkbox" data-k="news" checked> Events</label>
    <label><input type="checkbox" data-k="ema" checked> Moving averages + crosses</label>
    <label><input type="checkbox" data-k="trades" checked> Your trades &amp; setups</label>
    <label><input type="checkbox" data-k="vol" checked> Volume</label></span></div>
  <div class="row"><span class="lbl">Chart view</span><span class="modes" id="modes"><button data-m="price" class="on">Price</button><button data-m="volatility">Volatility</button><button data-m="volume">Volume</button></span></div>
  <div class="tiles" id="tiles"></div>
</div>
<div class="main">
  <div class="panel">
    <div class="chhd"><h2 id="title">📈 S&amp;P 500</h2><div class="legend" id="legend"></div></div>
    <div class="chartwrap"><div class="chart" id="chart"></div><div class="tip" id="tip"></div></div>
    <div class="react" id="react"></div>
  </div>
  <div class="panel"><div class="chhd"><h2>📰 Events</h2><span class="sub" id="ncount"></span></div><div class="feed" id="feed"></div>
    <div class="defs" id="defs"></div></div>
</div>
</div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script>
const $=s=>document.querySelector(s), fp=x=>Number(x)>=1000?Number(x).toFixed(0):Number(x).toFixed(2), pc=x=>x==null?'—':(x>=0?'+':'')+x.toFixed(1)+'%';
const RANGES=[['1m',22],['3m',66],['6m',126],['1y',252],['2y',0]];
let d,f,spy,hist,v1,cur='S&P 500',mode='price',range=126,endAt=null,cats=new Set(['all']),sel=null,api=null,series=null,minScore=8,show={news:1,ema:1,trades:1,vol:1};
Promise.all(['data.json','focus.json','spy-events.json','history.json','v1.json'].map(u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null))).then(([a,b,c,h,w])=>{
  d=a; f=b||{syms:[],events:{}}; spy=c||{events:[]}; hist=h||[]; v1=w||{};
  const syms=['S&P 500',...(f.syms||[]).filter(s=>d.charts&&d.charts[s])];
  const want=new URLSearchParams(location.search).get('s'); if(syms.includes(want))cur=want;
  $('#meta').textContent=`${syms.length} names · ${d.date} scan`;
  $('#chips').innerHTML=syms.map(s=>`<button data-s="${s}" class="${s===cur?'on':''}">${s}</button>`).join('');
  $('#chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.s;sel=null;cats=new Set(['all']);history.replaceState(null,'','?s='+encodeURIComponent(cur));draw();};
  $('#ranges').innerHTML=RANGES.map(([l,n])=>`<button data-r="${n}" class="${n===range?'on':''}">${l}</button>`).join('');
  $('#ranges').onclick=e=>{const b=e.target.closest('button');if(!b)return;range=+b.dataset.r;endAt=null;$('#scrub').value=100;draw();};
  $('#scrub').oninput=e=>{endAt=+e.target.value;draw();};
  $('#modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;draw();};
  $('#scores').onclick=e=>{const b=e.target.closest('button');if(!b)return;minScore=+b.dataset.s;document.querySelectorAll('#scores button').forEach(x=>x.classList.toggle('on',x===b));draw();};
  $('#show').onchange=e=>{show[e.target.dataset.k]=e.target.checked?1:0;draw();};
  strip(); draw();
});
function strip(){
  const m=(v1&&v1.market)||{}, bal=(d.plan&&d.plan.balance)||12674.74, g=d.charts['^GSPC'], n=g?g.c.length:0;
  const e10=g?g.e10[n-1]:0,e30=g?g.e30[n-1]:0, hi=g?Math.max(...g.h.slice(-252)):0, fromHi=g?(g.c[n-1]/hi-1)*100:0;
  const corr=fromHi>-5?'None (within 5% of the high)':fromHi>-10?'Pullback (5–10%)':fromHi>-20?'Correction (10–20%)':'Bear market (20%+)';
  const vix=d.vix||0, vlvl=vix<15?'LOW':vix<20?'NORMAL':vix<30?'ELEVATED':'HIGH';
  $('#read').innerHTML=`<h3>📊 Ledger read</h3><div class="big ${m.state==='BULLISH'?'up':m.state==='BEARISH'?'dn':'nt'}">${m.state||'—'}</div>
    <div class="kv"><span>Score</span><span>${m.score!=null?(m.score>0?'+':'')+m.score+' of ±5':'—'}</span><span>As of</span><span>${m.at?m.at.slice(0,16).replace('T',' ')+' CT':'—'}</span>
    <span>Parts</span><span>${m.parts?`ES ${m.parts.es>0?'+':''}${m.parts.es} · NQ ${m.parts.nq>0?'+':''}${m.parts.nq} · SPY ${m.parts.spy>0?'+':''}${m.parts.spy} · QQQ ${m.parts.qqq>0?'+':''}${m.parts.qqq} · breadth/VIX ${m.parts.breadth_vix>0?'+':''}${m.parts.breadth_vix}`:'—'}</span>
    <span>Setup F today</span><span>${(d.F||[]).map(x=>x.sym).join(', ')||'none'}</span></div><p class="sub" style="margin:8px 0 0">Context only, not a trade. A stock still needs its own source, level and trigger.</p>`;
  $('#risk').innerHTML=`<h3>⚠️ Risk rules</h3><div class="big">$${Math.round(bal*0.07).toLocaleString()}</div>
    <div class="kv"><span>Position size</span><span>7% of $${Math.round(bal).toLocaleString()} (shares)</span><span>One contract</span><span>$400 max · 3–9 days</span><span>Planned loss</span><span>$200 max · −50% stop</span><span>Take profit</span><span>+50% · chart stop first</span><span>No trade</span><span>index options · 0–2 DTE · earnings inside · spread over 10%</span></div>`;
  $('#cond').innerHTML=`<h3>🌊 Market conditions</h3><div class="big ${vix<20?'up':vix<30?'nt':'dn'}">VIX ${vix.toFixed(1)} · ${vlvl}</div>
    <div class="kv"><span>Regime</span><span>${d.regime||'—'}</span><span>S&P trend</span><span>${e10>e30?'UP (10 EMA over 30)':'DOWN (10 EMA under 30)'}</span><span>From 1y high</span><span class="${fromHi>-5?'up':fromHi>-15?'nt':'dn'}">${fromHi.toFixed(1)}%</span><span>Correction</span><span>${corr}</span><span>QQQ drawdown</span><span>${d.qdd!=null?d.qdd.toFixed(1)+'%':'—'}</span><span>Bubble plan</span><span>phase ${(d.bubble||{}).phase||'—'}</span></div>`;
}
// every event gets a measured reaction from the bars: day = close vs prior close on the event's session
// (a non-session date maps to the next session and says so); then +1, +3, +5 sessions from that close.
function measure(ev,s){
  const idx={}; s.d.forEach((t,i)=>idx[t]=i);
  return ev.map(e=>{let i=idx[e.date], shifted=false; if(i==null){i=s.d.findIndex(t=>t>e.date); shifted=i>=0;} if(i==null||i<1)return {...e,session:null};
    const C=s.c, r=k=>i+k<C.length?(C[i+k]/C[i]-1)*100:null, day=(C[i]/C[i-1]-1)*100;
    return {...e,session:s.d[i],shifted,day,d1:r(1),d3:r(3),d5:r(5),score:Math.min(10,Math.round(5+2*Math.abs(day))),reaction:day>0.5?'positive':day<-0.5?'negative':'flat'};});
}
function bigDays(list,s){
  // every 2.5%+ session gets an entry even with no headline on file, so a big move is never blank
  const have=new Set(list.map(e=>e.session)); const out=[];
  for(let i=1;i<s.c.length;i++){const day=(s.c[i]/s.c[i-1]-1)*100; if(Math.abs(day)>=2.5&&!have.has(s.d[i]))
    out.push({id:'b'+s.d[i],date:s.d[i],title:`Big move, no headline on file: ${cur==='S&P 500'?'S&P 500':cur} ${pc(day)}`,category:'Big Move',sentiment:'not rated',source:'measured from the bars',kind:'bigday'});}
  return list.concat(measure(out,s));
}
function events(s){
  if(cur==='S&P 500')return bigDays(measure(spy.events,s),s);
  const raw=((f.events||{})[cur]||[]).map((e,i)=>({id:'e'+i,date:e.date,title:e.text,category:{buy:'Your Trade',sell:'Your Trade',setup:'Setup F',level:'Level Alert',filing:'SEC Filing',news:'News'}[e.kind],
    sentiment:e.kind==='news'||e.kind==='filing'?'not rated':(e.up?'positive':'negative'),source:e.kind==='news'?'Yahoo':e.kind==='filing'?'SEC EDGAR':'Ledger',url:e.url,kind:e.kind}));
  return bigDays(measure(raw,s),s);
}
function draw(){
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on',b.dataset.s===cur));
  document.querySelectorAll('#ranges button').forEach(b=>b.classList.toggle('on',+b.dataset.r===range));
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  const s=d.charts[cur==='S&P 500'?'^GSPC':cur]; if(!s){$('#chart').innerHTML='<p class="sub">No bars for this name.</p>';return;}
  const n=s.d.length, win=range&&range<n?range:n, end=endAt==null?n:Math.max(win,Math.round(win+(n-win)*endAt/100)), from=end-win, T=s.d.slice(from,end);
  const ev=events(s), isTrade=e=>['buy','sell','setup','level'].includes(e.kind);
  const inRange=ev.filter(e=>e.session&&e.session>=T[0]&&e.session<=T[T.length-1]);
  const all=inRange.filter(e=>isTrade(e)?show.trades:(show.news&&(e.score||0)>=minScore));
  const catList=[...new Set(all.map(e=>e.category))];
  $('#pills').innerHTML=[`<button data-c="all" class="${cats.has('all')?'on':''}">All (${all.length})</button>`,...catList.map(c=>`<button data-c="${c}" class="${cats.has(c)?'on':''}">${c} (${all.filter(e=>e.category===c).length})</button>`)].join('');
  $('#pills').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;if(c==='all')cats=new Set(['all']);else{cats.delete('all');cats.has(c)?cats.delete(c):cats.add(c);if(!cats.size)cats=new Set(['all']);}draw();};
  const shown=all.filter(e=>cats.has('all')||cats.has(e.category));
  $('#title').innerHTML=`📈 ${cur==='S&P 500'?'S&amp;P 500':cur} ${mode==='price'?'Price':mode==='volatility'?'Volatility (VIX)':'Volume'}`;
  $('#ncount').textContent=`${shown.length} shown · ${inRange.length} in range · ${ev.length} loaded`;
  $('#legend').innerHTML=`<span><i style="background:var(--up)"></i>market up that day</span><span><i style="background:var(--dn)"></i>down</span><span><i style="background:var(--dim)"></i>flat (±0.5%)</span>`+
    (show.ema&&mode==='price'?`<span><b style="color:#00e676">+</b> / <b style="color:#ff1744">X</b> = 10 EMA crossing the 30, a chart note, not a signal</span>`:'')+`<span>${T.length} sessions</span>`;
  const c=s.c.slice(from,end), hi=Math.max(...s.h.slice(from,end)), lo=Math.min(...s.l.slice(from,end)); let pk=c[0],dd=0; c.forEach(x=>{pk=Math.max(pk,x);dd=Math.min(dd,x/pk-1);});
  const ret=(c[c.length-1]/c[0]-1)*100;
  $('#span').textContent=`${T[0]} – ${T[T.length-1]}`;
  $('#tiles').innerHTML=[['Period return',pc(ret),ret>=0?'up':'dn'],['Period high',fp(hi),''],['Period low',fp(lo),''],['Max drawdown',(dd*100).toFixed(1)+'%','dn'],['Last close',fp(c[c.length-1]),''],['Sessions',T.length,''],['Events shown',shown.length,'']]
    .map(([k,v,cl])=>`<div class="tile"><div class="k">${k}</div><div class="v ${cl}">${v}</div></div>`).join('');
  if(api){api.remove();api=null;}
  const css=getComputedStyle(document.documentElement), v=k=>css.getPropertyValue(k).trim(), L=LightweightCharts;
  api=L.createChart($('#chart'),{autoSize:true,layout:{background:{type:L.ColorType.Solid,color:v('--bg')},textColor:v('--dim'),fontFamily:"'IBM Plex Mono', monospace",fontSize:11},
    localization:{priceFormatter:fp},grid:{vertLines:{color:v('--line')},horzLines:{color:v('--line')}},rightPriceScale:{borderColor:v('--line2'),scaleMargins:{top:.1,bottom:mode==='price'&&show.vol?.22:.08}},timeScale:{borderColor:v('--line2'),rightOffset:4}});
  const hiMap={}; { const H=s.h; for(let i=0;i<n;i++){ hiMap[s.d[i]]=Math.max(...H.slice(Math.max(0,i-252),i+1)); } }
  if(mode==='volatility'){
    const vx=hist.filter(h=>h.date>=T[0]&&h.date<=T[T.length-1]).map(h=>({time:h.date,value:h.vix}));
    series=api.addSeries(L.LineSeries,{color:v('--dn'),lineWidth:2,priceLineVisible:false}); series.setData(vx);
  }else if(mode==='volume'){
    series=api.addSeries(L.HistogramSeries,{priceFormat:{type:'volume'},priceLineVisible:false});
    series.setData(T.map((t,i)=>({time:t,value:s.v[from+i]||0,color:(s.c[from+i]>=s.o[from+i]?v('--up'):v('--dn'))+'90'})));
  }else{
    series=api.addSeries(L.CandlestickSeries,{upColor:v('--up'),downColor:v('--dn'),borderVisible:false,wickUpColor:v('--up'),wickDownColor:v('--dn'),priceLineColor:v('--amber')});
    series.setData(T.map((t,i)=>({time:t,open:s.o[from+i],high:s.h[from+i],low:s.l[from+i],close:s.c[from+i]})));
    if(show.ema){
      const line=(vals,color)=>{const ls=api.addSeries(L.LineSeries,{color,lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});ls.setData(T.map((t,i)=>({time:t,value:vals[from+i]})));return ls;};
      const s10=line(s.e10,'#43a047'); line(s.e30,'#1e88e5');
      const X=[]; for(let i=Math.max(1,from);i<end;i++){const a=s.e10[i]>s.e30[i]; if(a!==(s.e10[i-1]>s.e30[i-1]))X.push({time:s.d[i],price:s.e30[i],up:a});}
      s10.attachPrimitive({paneViews:()=>[{renderer:()=>({draw:t=>t.useMediaCoordinateSpace(({context:cx})=>{X.forEach(m=>{const x=api.timeScale().timeToCoordinate(m.time),y=s10.priceToCoordinate(m.price);if(x==null||y==null)return;
        const r=m.up?11:9;cx.lineCap='round';const pen=(w,col)=>{cx.lineWidth=w;cx.strokeStyle=col;cx.beginPath();if(m.up){cx.moveTo(x-r,y);cx.lineTo(x+r,y);cx.moveTo(x,y-r);cx.lineTo(x,y+r);}else{const q=r*.75;cx.moveTo(x-q,y-q);cx.lineTo(x+q,y+q);cx.moveTo(x+q,y-q);cx.lineTo(x-q,y+q);}cx.stroke();};pen(7,v('--bg'));pen(4,m.up?'#00e676':'#ff1744');});})})}]});
    }
    if(show.vol){const vol=api.addSeries(L.HistogramSeries,{priceFormat:{type:'volume'},priceScaleId:'volume',lastValueVisible:false,priceLineVisible:false});
      vol.setData(T.map((t,i)=>({time:t,value:s.v[from+i]||0,color:(s.c[from+i]>=s.o[from+i]?v('--up'):v('--dn'))+'60'}))); api.priceScale('volume').applyOptions({visible:false,scaleMargins:{top:.82,bottom:0}});}
    if(show.trades)(d.open||[]).filter(p=>p.symbol===cur&&p.acct==='real').forEach(p=>{const mark=(price,title,color)=>price&&series.createPriceLine({price:+price,title,color,lineWidth:1,lineStyle:L.LineStyle.Dashed,axisLabelVisible:true});
      if(p.kind==='shares')mark(p.entry,'ENTRY',v('--amber')); else mark(p.strike,`${p.strike}C`,v('--amber')); if(p.target)mark(p.target,'TARGET',v('--up'));});
  }
  const col=e=>isTrade(e)?(e.kind==='sell'?v('--amber'):'#00e676'):e.reaction==='positive'?v('--up'):e.reaction==='negative'?v('--dn'):v('--dim');
  const top=e=>!isTrade(e)&&(e.score||0)>=10;
  const setMarks=()=>{const m=shown.map(e=>({time:e.session,position:isTrade(e)&&e.kind!=='sell'?'belowBar':'aboveBar',shape:isTrade(e)?(e.kind==='sell'?'arrowDown':'arrowUp'):top(e)?'square':'circle',
      color:e.id===sel?'#FFD700':col(e),size:e.id===sel?2:top(e)?1.6:1,text:e.id===sel?e.title.slice(0,36):top(e)?'✓':''}));
    m.sort((a,b)=>a.time<b.time?-1:a.time>b.time?1:0); L.createSeriesMarkers(series,m);};
  setMarks(); api.timeScale().fitContent();
  api.subscribeClick(p=>{if(!p.time)return;const e=shown.find(x=>x.session===p.time);if(e)focus(e,true);});
  const tip=$('#tip'), wrap=$('.chartwrap');
  api.subscribeCrosshairMove(p=>{
    if(!p.time||!p.point||p.point.x<0||p.point.y<0){tip.style.display='none';return;}
    const i=s.d.indexOf(p.time); if(i<0){tip.style.display='none';return;}
    const here=shown.filter(e=>e.session===p.time), h=hiMap[p.time], fromHi=h?((s.c[i]/h-1)*100):null, day=i>0?(s.c[i]/s.c[i-1]-1)*100:null;
    const px=mode==='volatility'?`VIX <b>${((hist.find(x=>x.date===p.time)||{}).vix||0).toFixed(2)}</b>`:mode==='volume'?`Volume <b>${(s.v[i]/1e6).toFixed(1)}M</b>`:`Close <b>${fp(s.c[i])}</b> <span class="${day>=0?'up':'dn'}">${pc(day)}</span> on the day`;
    tip.innerHTML=`<b>${p.time}</b> <small>${fromHi!=null?pc(fromHi)+' from 1y high':''}</small><div>${px}</div>`+
      (here.length?`<div class="n"><small>${here.length} event${here.length>1?'s':''} this session</small>${here.slice(0,4).map(e=>`<div><i style="background:${col(e)}"></i>${e.title}<br><small>${isTrade(e)?e.category:'sentiment '+e.sentiment+' · move score '+e.score}</small></div>`).join('')}${here.length>4?`<small>+${here.length-4} more</small>`:''}</div>`:'');
    tip.style.display='block'; const W=wrap.clientWidth, tw=tip.offsetWidth; tip.style.left=Math.min(Math.max(8,p.point.x+16),W-tw-8)+'px'; tip.style.top=Math.max(8,p.point.y-20)+'px';});
  $('#feed').innerHTML=shown.slice().reverse().map(e=>{const h=hiMap[e.session],px=s.c[s.d.indexOf(e.session)],fromHi=h&&px?((px/h-1)*100):null;
    return `<div class="card ${e.id===sel?'on':''}" data-id="${e.id}"><span class="badge">${e.category}</span>${top(e)?`<span class="badge" style="border-color:${col(e)};color:${col(e)}">✓ 10</span>`:''}<h3>${e.url?`<a href="${e.url}" target="_blank" rel="noopener">${e.title}</a>`:e.title}</h3>${e.description?`<p>${e.description}</p>`:''}
      <div class="m"><span><i style="background:${col(e)}"></i>market ${isTrade(e)?pc(e.day)+' that day':e.reaction+' that day ('+pc(e.day)+')'}</span>${!isTrade(e)?`<span>sentiment: ${e.sentiment}</span><span>move score ${e.score}/10</span>${e.analyst?`<span>analyst relevance ${e.analyst}/10</span>`:''}`:''}${fromHi!=null?`<span>${pc(fromHi)} from 1y high</span>`:''}<span>${e.date}${e.shifted?' (non-session, shown on '+e.session+')':''}</span><span>${e.source||''}</span>${e.context?`<span>${e.context}</span>`:''}</div></div>`;}).join('')||'<p class="sub">No events in this range at this score. Try "All".</p>';
  $('#defs').innerHTML=`<b>Definitions.</b> <i>Market that day</i> = ${cur==='S&P 500'?'S&P 500':cur} close vs the prior close on the event's session. <i>Sentiment</i> = the headline's tone: hand-rated for the 2025 set, "not rated" for the scan headlines. <i>Move score</i> = 5 + 2 × |day move|, capped at 10. <i>Analyst relevance</i> = the 2025 set's hand score, kept separate. <i>From 1y high</i> = close vs the highest high of the prior 252 sessions. A headline is listed under the day the report carried it, not the minute it was published.`;
  $('#feed').onclick=ev2=>{const c2=ev2.target.closest('.card');if(!c2||ev2.target.tagName==='A')return;const e=shown.find(x=>String(x.id)===c2.dataset.id);if(e)focus(e,false);};
  function focus(e,fromChart){sel=e.id===sel?null:e.id;setMarks();document.querySelectorAll('.card').forEach(c2=>c2.classList.toggle('on',c2.dataset.id===String(sel)));
    const R=$('#react');
    if(sel===null){R.classList.remove('on');return;}
    const i=T.indexOf(e.session);if(i>=0)api.timeScale().setVisibleLogicalRange({from:Math.max(0,i-25),to:Math.min(T.length+3,i+15)});
    const hday=hist.find(x=>x.date===e.session);
    const tone=e.sentiment&&e.sentiment!=='not rated'?((e.sentiment==='positive'&&e.day<-0.5)||(e.sentiment==='negative'&&e.day>0.5)?"The market moved against the headline's tone.":"The market moved with the headline's tone."):'The tone was not rated; only the move is measured.';
    R.classList.add('on'); R.innerHTML=`<h4>${e.title}</h4><div class="sub">${e.date}${e.shifted?' · not a session, measured on '+e.session:''} · ${e.category} · sentiment ${e.sentiment||'—'}${e.analyst?' · analyst relevance '+e.analyst+'/10':''}</div>
      <div class="g"><div><div class="k">That day</div><div class="v ${e.day>=0?'up':'dn'}">${pc(e.day)}</div></div><div><div class="k">+1 session</div><div class="v ${e.d1>=0?'up':'dn'}">${pc(e.d1)}</div></div><div><div class="k">+3 sessions</div><div class="v ${e.d3>=0?'up':'dn'}">${pc(e.d3)}</div></div><div><div class="k">+5 sessions</div><div class="v ${e.d5>=0?'up':'dn'}">${pc(e.d5)}</div></div></div>
      <div class="sub">${hday?`Ledger that day: VIX ${hday.vix.toFixed(1)} · ${hday.regime}${hday.F&&hday.F.length?' · Setup F: '+hday.F.join(', '):''}.`:'No Ledger scan record for that day.'} ${tone} Reactions are measured, not attributed: other news shares the same day.</div>`;
    if(fromChart){const c2=document.querySelector(`.card[data-id="${sel}"]`);if(c2)c2.scrollIntoView({block:'nearest',behavior:'smooth'});}}
}
</script>
</body>
</html>
