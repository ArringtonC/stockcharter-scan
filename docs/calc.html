<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ledger.css">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:var(--s4) 16px 96px}
.back{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim);text-decoration:none}
h1{font:300 clamp(32px,7vw,48px)/1.05 var(--serif);margin:var(--s3) 0 var(--s2)}
.sub{color:var(--dim);font-size:var(--t-data)}
.card{border:1px solid var(--line);background:var(--panel);padding:14px 16px;margin:0 0 var(--s4)}
.hd b{font:600 var(--t-h2) var(--mono)}
.est{margin:10px 0;font-size:var(--t-data);color:var(--ink2);display:grid;gap:3px}
.est b{color:var(--ink)}.est .r{color:var(--dn)}
.up{color:var(--up)}.dn{color:var(--dn)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:var(--t-data);color:var(--dim);margin:6px 0 10px;align-items:center}
.ctl label{display:flex;gap:6px;align-items:center}
.ctl input[type=number]{width:84px;background:var(--bg);color:var(--ink);border:1px solid var(--line2);padding:4px 6px;font:500 var(--t-data) var(--mono)}
.ctl select{background:var(--bg);color:var(--ink);border:1px solid var(--line2);padding:4px 6px;font:500 var(--t-data) var(--mono)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font:500 var(--t-data) var(--mono);font-variant-numeric:tabular-nums}
th,td{padding:3px 6px;text-align:right;border:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--panel);color:var(--ink);z-index:1}
th.exp{color:var(--ink);background:var(--line2)}
td.pct{color:var(--dim)}
tr.spot td:first-child{color:var(--amber)}
.key{font-size:var(--t-label);color:var(--dim);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="index.html">← Ledger</a>
<h1>Call calculator</h1>
<p class="sub" id="meta">Loading…</p>
<div id="cards"></div>
<p class="sub">Each open call: profit or loss by stock price (rows) and date (columns). Type a price range to zoom in. IV change shows what a volatility drop after earnings does. Estimates only.</p>
</div>
<script>
const $=s=>document.querySelector(s);
const ncdf=x=>{const t=1/(1+.2316419*Math.abs(x)),d=.3989423*Math.exp(-x*x/2);
  let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p;};
const bs=(s,k,t,v,r=.04)=>{if(t<=0||v<=0)return Math.max(0,s-k);const d1=(Math.log(s/k)+(r+v*v/2)*t)/(v*Math.sqrt(t)),d2=d1-v*Math.sqrt(t);
  return s*ncdf(d1)-k*Math.exp(-r*t)*ncdf(d2);};
const fp=x=>'$'+Number(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const shade=(v,max)=>{const a=Math.min(1,Math.abs(v)/max)*.6;return v>=0?`rgba(95,191,132,${a})`:`rgba(224,107,90,${a})`;};
const niceStep=span=>{const raw=span/20;for(const s of [.05,.1,.25,.5,1,2.5,5,10,25,50])if(s>=raw)return s;return 100;};
fetch('data.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  const calls=(d.open||[]).filter(r=>r.acct==='real'&&r.kind==='call'&&r.expiry&&r.spot);
  $('#meta').textContent=`${calls.length} open calls · as at ${d.date} scan`;
  const today=new Date(d.date+'T00:00:00');
  $('#cards').innerHTML=calls.map((r,i)=>`<div class="card" id="c${i}"></div>`).join('')||'<p class="sub">No open calls.</p>';
  calls.forEach((r,i)=>{
    const K=+r.strike,n=+r.contracts||1,entry=+r.entry,spot=+r.spot,iv0=+r.iv||.5,exp=new Date(r.expiry+'T00:00:00'),dte=Math.max(0,Math.round((exp-today)/864e5));
    const cost=entry*100*n, be=K+entry, box=$('#c'+i);
    let lo=+(spot*.95).toFixed(2), hi=+(spot*1.05).toFixed(2), ivch=0, mode='pct';
    // probability of profit: the chance the stock ends above breakeven, lognormal at this IV
    const pop=iv=>dte>0?100*(1-ncdf((Math.log(be/spot)-(.04-iv*iv/2)*dte/365)/(iv*Math.sqrt(dte/365)))):(spot>be?100:0);
    const draw=()=>{
      const iv=Math.max(.01,iv0*(1+ivch/100));
      const every=Math.max(1,Math.ceil(dte/12)), cols=[];
      for(let c=0;c<dte;c+=every)cols.push(c); cols.push(dte);
      const step=niceStep(hi-lo), rows=[]; for(let S=Math.ceil(hi/step)*step;S>=lo-1e-9;S-=step)rows.push(+S.toFixed(2));
      const pl=(S,days)=>(bs(S,K,Math.max(0,dte-days)/365,iv)-entry)*100*n;
      const val=v=>mode==='pct'?Math.round(v/cost*100):Math.round(v);
      const max=Math.max(1,...rows.map(S=>Math.abs(pl(S,dte))));
      const spotRow=rows.reduce((a,b)=>Math.abs(b-spot)<Math.abs(a-spot)?b:a);
      const month=c=>{const dt=new Date(today);dt.setDate(dt.getDate()+c);return dt;};
      box.innerHTML=`<div class="hd"><b>${r.symbol} ${r.expiry.slice(5).replace('-','/')} $${K}C × ${n}</b></div>
        <div class="est"><span>Entry cost: <b>${fp(cost)}</b> (paid ${fp(entry)} · mark ${fp(r.now)} · <b class="${+r.pl_pct>=0?'up':'dn'}">${(+r.pl_pct).toFixed(0)}%</b> now)</span>
        <span>Maximum risk: <b class="r">${fp(cost)}</b> (at ${r.symbol} ≤ $${K} at expiry)</span>
        <span>Breakeven at expiry: <b>${fp(be)}</b> (${((be/spot-1)*100).toFixed(1)}% from ${fp(spot)})</span>
        <span>Probability of profit: <b>${pop(iv).toFixed(1)}%</b> · ${dte} days · IV ${(iv*100).toFixed(0)}%</span></div>
        <div class="ctl"><label>Stock price range: $<input type="number" step="0.25" value="${lo}" data-k="lo"> – <input type="number" step="0.25" value="${hi}" data-k="hi"></label>
        <label>IV change <select data-k="iv">${[-50,-40,-30,-20,-10,0,10,20,30].map(x=>`<option value="${x}" ${x===ivch?'selected':''}>${x>0?'+':''}${x}%</option>`).join('')}</select></label>
        <label>Values <select data-k="mode"><option value="pct" ${mode==='pct'?'selected':''}>% of maximum risk</option><option value="usd" ${mode==='usd'?'selected':''}>$ profit / loss</option></select></label></div>
        <div class="scroll"><table><thead><tr><th>${r.symbol}</th>${cols.map(c=>`<th class="${c===dte?'exp':''}">${c===dte?'Exp':month(c).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</th>`).join('')}<th>+/-%</th></tr></thead>
        <tbody>${rows.map(S=>`<tr class="${S===spotRow?'spot':''}"><td>${S.toFixed(2)}</td>${cols.map(c=>{const v=pl(S,c);return `<td style="background:${shade(v,max)}">${val(v)}</td>`;}).join('')}<td class="pct">${((S/spot-1)*100).toFixed(2)}%</td></tr>`).join('')}</tbody></table></div>
        <div class="key">Amber = today's price ${fp(spot)}. Cells: ${mode==='pct'?'% of the money at risk':'dollars'}. Black-Scholes at the implied volatility from the last mark; a real quote has a spread.</div>`;
      box.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',e=>{
        const k=e.target.dataset.k, v=e.target.value;
        if(k==='lo')lo=+v; else if(k==='hi')hi=+v; else if(k==='iv')ivch=+v; else mode=v;
        if(lo>=hi){lo=Math.min(lo,hi-1);} draw();}));
    };
    draw();
  });
}).catch(()=>{$('#meta').textContent='Could not load data.json.'});
</script>
</body>
</html>
