<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Ledger redesign — the approved system, extracted from Today (page 1).
   Pages 2-8 link this file. Do not fork it; if a page needs a new component,
   add it here so every page gets it. */
/* ── KEPT VERBATIM FROM index.html. No new design language was invented. ───── */
:root{
  --bg:#0E0F12;--bg2:#141518;--panel:#191A1F;--line:#26282F;--line2:#33363F;
  --ink:#E8E4DB;--ink2:#A8A49B;--dim:#6E6B64;
  --amber:#E2A73B;--amber2:#F5C866;--up:#5FBF84;--dn:#E06B5A;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --serif:'Fraunces',Georgia,serif;
  --s1:6px; --s2:10px; --s3:16px; --s4:24px; --s5:36px; --s6:56px;
  --t-hero:76px; --t-h1:30px; --t-h2:19px; --t-body:14px; --t-data:12.5px; --t-label:10.5px; --tr:.12em;
}
/* CHANGED: the light palette was behind a bare media query, so an explicit light
   choice could never win over a dark OS. Same colors, three states now. */
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#F4F1EA;--bg2:#ECE8DF;--panel:#FBF9F4;--line:#D9D3C6;--line2:#C6BFAF;
  --ink:#17181C;--ink2:#4A4C55;--dim:#8A877E;
  --amber:#9A6A12;--amber2:#7A5208;--up:#1E6E44;--dn:#B23A2A;}}
:root[data-theme=light]{
  --bg:#F4F1EA;--bg2:#ECE8DF;--panel:#FBF9F4;--line:#D9D3C6;--line2:#C6BFAF;
  --ink:#17181C;--ink2:#4A4C55;--dim:#8A877E;
  --amber:#9A6A12;--amber2:#7A5208;--up:#1E6E44;--dn:#B23A2A;}
:root[data-theme=dark]{
  --bg:#0E0F12;--bg2:#141518;--panel:#191A1F;--line:#26282F;--line2:#33363F;
  --ink:#E8E4DB;--ink2:#A8A49B;--dim:#6E6B64;
  --amber:#E2A73B;--amber2:#F5C866;--up:#5FBF84;--dn:#E06B5A;}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:var(--t-body)/1.6 var(--mono);background:var(--bg)}
h1,h2,h3{text-wrap:balance}

/* ── shared page components ───────────────────────────────────────────────── */
/* the page components use @container so they respond to the panel, not the window.
   That needs the panel to BE a container. */
.today{padding:0 0 var(--s5);container-type:inline-size}


/* masthead — CHANGED: admin control removed, identity only */
.tmast{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;
  border-bottom:1px solid var(--line2);padding-bottom:var(--s2)}
.tmast h1{font:300 var(--t-h2)/1 var(--serif);margin:0;letter-spacing:-.01em}
.tmast h1 b{font-weight:700;color:var(--amber)}
.tmast .when{font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.tmast .when.stale{color:var(--dn)}

/* verdict hero — the whole point of the redesign */
.verdict{padding:var(--s5) 0 var(--s4);border-bottom:1px solid var(--line)}
.verdict .eyebrow{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim);margin-bottom:var(--s2)}
.verdict p.say{font:300 clamp(30px,5.2vw,46px)/1.12 var(--serif);letter-spacing:-.02em;margin:0;max-width:20ch;color:var(--ink)}
.verdict p.say b{font-weight:600;color:var(--amber)}
.verdict p.say.fires b{color:var(--up)}
.verdict .sub{margin:var(--s3) 0 0;font-size:var(--t-data);line-height:1.65;color:var(--ink2);max-width:60ch}
.verdict .sub b{color:var(--ink);font-weight:500}
/* CHANGED: the paragraph became one scannable count line plus one sentence. */
.vstat{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4);
  font:500 var(--t-data) var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.vstat b{color:var(--ink);font-weight:600}
.vquiet{margin:var(--s1) 0 0;font-size:var(--t-data);line-height:1.6;color:var(--dim);max-width:60ch}
.vquiet b{color:var(--ink2);font-weight:500}
.verdict .row:first-of-type{margin-top:var(--s4)}

/* what this is — Karla asked "is this recommendations?", "is this an app?",
   "how does it work?". One line answers all three; the detail folds away. */
.whatis{margin-top:var(--s2);border-bottom:1px solid var(--line)}
.whatis>summary{cursor:pointer;list-style:none;display:flex;gap:var(--s2);flex-wrap:wrap;
  align-items:baseline;padding:var(--s2) 0;font-size:var(--t-data);color:var(--ink2)}
.whatis>summary::-webkit-details-marker{display:none}
.whatis>summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.whatis b.not{color:var(--dn);font-weight:600}
.whatis .how{margin-left:auto;font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--amber);white-space:nowrap}
.whatis[open] .how::after{content:' ▴'}
.whatis:not([open]) .how::after{content:' ▾'}
.whatis .in{padding:0 0 var(--s3)}
.whatis .in p{margin:0 0 var(--s2);font-size:var(--t-data);line-height:1.65;color:var(--ink2);max-width:66ch}
.whatis .in b{color:var(--ink);font-weight:500}

/* summary pair — Getting close and Watching sit together, above the trades */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
@container (max-width:820px){.sum{grid-template-columns:1fr;gap:var(--s5)}}
.row.tight{padding:var(--s2) 0;align-items:center}
.row.tight .miss{margin-top:0}
.row .num .mid{font:600 var(--t-body) var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.row .num .mid.up{color:var(--up)}.row .num .mid.dn{color:var(--dn)}
.more{margin:var(--s2) 0 0;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim)}

/* recent activity — the week strip is five real scans, not a sparkline */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-top:var(--s3)}
.week>div{background:var(--panel);padding:var(--s2);text-align:center}
.week>div.hit{background:color-mix(in srgb,var(--up) 14%,var(--panel))}
.week .wd{display:block;font-size:var(--t-label);letter-spacing:var(--tr);color:var(--dim)}
.week .wn{display:block;font:600 var(--t-h2)/1.2 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.week>div.hit .wn{color:var(--up)}

/* market context — CHANGED: was a 76px hero, now one quiet strip */
.ctx{display:flex;flex-wrap:wrap;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.ctx div{display:flex;flex-direction:column;gap:2px}
.ctx .l{font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.ctx .v{font:600 var(--t-h2)/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink)}
.ctx .v small{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--ink2);margin-left:var(--s1)}
.ctx .warn{margin:var(--s2) 0 0;width:100%;font-size:var(--t-data);color:var(--ink2)}

/* sections */
.sec{padding-top:var(--s5)}
.sec h2{font:600 var(--t-h2)/1.2 var(--serif);margin:0 0 var(--s1);letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.sec h2 .tag{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;
  border:1px solid var(--line2);border-radius:3px;padding:2px 7px;color:var(--ink2)}
.sec h2 .tag.trade{color:var(--amber);border-color:var(--amber)}
.sec h2 .tag.watch{color:var(--dim)}
.sec p.lede{margin:0 0 var(--s3);font-size:var(--t-data);color:var(--dim);max-width:72ch}
.empty{font-size:var(--t-data);color:var(--dim);padding:var(--s2) 0}

/* rows — LAYOUT rule: thin rules, not filled cards */
.row{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:var(--s2) var(--s3);
  align-items:baseline;padding:var(--s3) 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row .sym{font:600 var(--t-body) var(--mono);color:var(--ink);letter-spacing:.02em}
.row .sym small{display:block;font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim);font-weight:500;margin-top:2px}
.row .main{min-width:0}
.row .main .t{font-size:var(--t-body);color:var(--ink);line-height:1.45}
.row .main .miss{margin-top:var(--s1);font-size:var(--t-data);color:var(--ink2)}
.row .main .miss b{color:var(--dn);font-weight:500}
.row .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .num .big{font:600 var(--t-h2)/1 var(--serif);color:var(--ink)}
.row .num .u{display:block;font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim);margin-top:3px}
.row .num .up{color:var(--up)}.row .num .dn{color:var(--dn)}
@container (max-width:560px){
  .row{grid-template-columns:1fr auto}
  .row .sym{grid-column:1}
  .row .num{grid-column:2;grid-row:1}
  .row .main{grid-column:1/-1}
}

/* disclosure — CHANGED: empty setup detail collapses instead of filling the page */
.deep{margin-top:var(--s5);border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.deep summary{cursor:pointer;list-style:none;padding:var(--s3);display:flex;align-items:center;gap:var(--s2);
  font:500 var(--t-data) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--ink2)}
.deep summary::-webkit-details-marker{display:none}
.deep summary::after{content:'+';margin-left:auto;color:var(--dim);font-size:var(--t-h2);line-height:1}
.deep[open] summary::after{content:'−'}
.deep summary:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.deep .in{padding:0 var(--s3) var(--s3)}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2) var(--s3);align-items:baseline;
  padding:var(--s2) 0;border-top:1px solid var(--line)}
.chk .k{font:700 var(--t-label) var(--mono);letter-spacing:var(--tr);color:var(--dim);
  border:1px solid var(--line2);border-radius:3px;padding:2px 6px;min-width:2.1rem;text-align:center}
.chk .d{font-size:var(--t-data);color:var(--ink2);min-width:0}
.chk .r{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;white-space:nowrap}
.chk .r.no{color:var(--dim)}.chk .r.yes{color:var(--up)}

/* skeleton + error states */
.sk{background:var(--line);border-radius:4px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.85}}
.err{border:1px solid var(--dn);border-radius:6px;padding:var(--s3);color:var(--dn);font-size:var(--t-data);background:var(--panel)}
.stalebar{border:1px solid var(--dn);border-left-width:3px;border-radius:5px;padding:var(--s2) var(--s3);
  margin-bottom:var(--s3);font-size:var(--t-data);color:var(--ink2);background:var(--panel)}
.stalebar b{color:var(--dn)}
.foot{margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--line);
  font-size:var(--t-label);line-height:1.7;color:var(--dim)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── app shell ─────────────────────────────────────────────────────────────── */
.wrap{max-width:1040px;margin:0 auto;padding:var(--s4) 18px 96px}
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;
  padding-bottom:var(--s3)}
.mast h1{margin:0;font:300 var(--t-h1)/1 var(--serif);letter-spacing:-.01em}
.mast h1 b{font-weight:700;color:var(--amber)}
.mast .stamp{font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.mast .stamp.stale{color:var(--dn)}

nav{display:flex;gap:2px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{appearance:none;background:none;border:0;white-space:nowrap;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--dim);
  font:500 var(--t-data) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;padding:12px 16px}
nav button:hover{color:var(--ink2)}
nav button[aria-selected=true]{color:var(--amber);border-bottom-color:var(--amber)}
nav button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
nav .n{display:inline-block;min-width:18px;margin-left:6px;font-size:var(--t-label);padding:1px 5px;
  border-radius:9px;background:var(--line);color:var(--ink2)}

/* Research holds four reference pages behind one tab */
.sub{display:flex;gap:2px;margin-top:var(--s3);overflow-x:auto;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{appearance:none;background:none;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line2);border-radius:3px;padding:6px 11px;color:var(--dim);
  font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase}
.sub button[aria-selected=true]{border-color:var(--amber);color:var(--amber)}
.sub button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

section[role=tabpanel]{padding-top:var(--s2);animation:in .3s cubic-bezier(.2,.8,.2,1)}
[hidden]{display:none!important}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.scroll{overflow-x:auto}
/* ── Trades ─────────────────────────────── */
.pos{border-top:1px solid var(--line);padding:0}
.pos:last-of-type{border-bottom:1px solid var(--line)}
.pos>summary{cursor:pointer;list-style:none;display:grid;
  grid-template-columns:7rem minmax(0,1fr) 7.5rem 8rem;gap:var(--s2) var(--s3);
  align-items:baseline;padding:var(--s3) 0}
.pos>summary::-webkit-details-marker{display:none}
.pos>summary:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.pos:hover>summary{background:color-mix(in srgb,var(--amber) 4%,transparent)}
.pos .sym{font:600 var(--t-body) var(--mono);color:var(--ink);letter-spacing:.02em}
.pos .sym small{display:block;margin-top:3px;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim);font-weight:500}
.pos .say{min-width:0;font-size:var(--t-body);color:var(--ink);line-height:1.45}
.pos .say .rule{display:block;margin-top:var(--s1);font-size:var(--t-data);color:var(--ink2)}
.pos .pl{text-align:right;font-variant-numeric:tabular-nums}
.pos .pl b{font:600 var(--t-h2)/1 var(--serif)}
.pos .pl small{display:block;margin-top:3px;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim)}
.pos .st{text-align:right;font-variant-numeric:tabular-nums}
.pos .st .bar{position:relative;display:block;height:5px;border-radius:3px;background:var(--line);margin:0 0 5px auto;width:100%}
.pos .st .bar i{position:absolute;inset:0 auto 0 0;background:var(--amber);border-radius:3px}
.pos .st small{font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.pos>summary::after{content:'+';grid-column:4;justify-self:end;color:var(--dim)}
.pos .mech{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s3);
  padding:0 0 var(--s4);border-left:2px solid var(--line2);padding-left:var(--s3);margin:0 0 var(--s3)}
.pos .mech div{display:flex;flex-direction:column;gap:2px}
.pos .mech .l{font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.pos .mech .v{font:500 var(--t-data) var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.real{background:var(--dn);color:#fff;border-radius:3px;padding:1px 6px;font:700 var(--t-label) var(--mono);
  letter-spacing:var(--tr);text-transform:uppercase}
.setup{border:1px solid var(--amber);color:var(--amber);border-radius:3px;padding:1px 6px;
  font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase}
.setup.off{border-color:var(--line2);color:var(--dim)}
.perf{display:flex;flex-wrap:wrap;gap:var(--s5);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.perf div{display:flex;flex-direction:column;gap:2px}
.perf .l{font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.perf .v{font:600 var(--t-h2)/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.perf .n{font-size:var(--t-label);color:var(--dim)}
.planrow{display:grid;grid-template-columns:8rem minmax(0,1fr) auto;gap:var(--s2) var(--s3);
  align-items:baseline;padding:var(--s3) 0;margin-top:var(--s3);text-decoration:none;color:inherit;
  border-top:1px solid var(--amber);border-bottom:1px solid var(--line)}
.planrow:hover,.planrow:focus-visible{background:color-mix(in srgb,var(--amber) 6%,transparent);outline:none}
.planrow .sym{font:600 var(--t-body) var(--mono);color:var(--amber)}
.planrow .sym small{display:block;margin-top:3px;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim);font-weight:500}
.planrow .main{min-width:0}
.planrow .main .t{display:block;font:600 var(--t-h2) var(--serif);color:var(--ink);letter-spacing:-.01em}
.planrow .main .miss{display:block;margin-top:var(--s1);font-size:var(--t-data);color:var(--ink2)}
.planrow .num .u{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--amber);white-space:nowrap}
@container (max-width:620px){.planrow{grid-template-columns:1fr}.planrow .num{display:none}}
.pm{display:inline-block;margin-top:var(--s1);font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--amber);text-decoration:none;border-bottom:1px solid transparent}
.pm:hover,.pm:focus-visible{border-bottom-color:var(--amber);outline:none}
.pmrow{display:grid;grid-template-columns:7rem minmax(0,1fr) auto;gap:var(--s2) var(--s3);
  align-items:baseline;padding:var(--s3) 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.pmrow:last-of-type{border-bottom:1px solid var(--line)}
.pmrow:hover,.pmrow:focus-visible{background:color-mix(in srgb,var(--amber) 5%,transparent);outline:none}
.pmrow .sym{font:600 var(--t-body) var(--mono);color:var(--ink)}
.pmrow .sym small{display:block;margin-top:3px;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim);font-weight:500}
.pmrow .main{min-width:0}
.pmrow .main .t{display:block;font-size:var(--t-body);color:var(--ink)}
.pmrow .main .miss{display:block;margin-top:var(--s1);font-size:var(--t-data);color:var(--ink2)}
.pmrow .num{text-align:right;white-space:nowrap}
.pmrow .num .mid{font:600 var(--t-body) var(--mono);font-variant-numeric:tabular-nums}
.pmrow .num .mid.up{color:var(--up)}.pmrow .num .mid.dn{color:var(--dn)}
.pmrow .num .u{display:block;margin-top:3px;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--amber)}
@container (max-width:680px){
  .pos>summary{grid-template-columns:minmax(0,1fr) auto}
  .pos .sym{grid-column:1;grid-row:1}
  .pos .pl{grid-column:2;grid-row:1}
  .pos .say{grid-column:1/-1;grid-row:2}
  .pos .st{grid-column:1/-1;grid-row:3;text-align:left}
  .pos .st .bar{margin-left:0}
  .pos>summary::after{display:none}
}

/* ── Watching ─────────────────────────────── */
/* status is the organising idea on this page, so it gets the left edge */
.wrow{display:grid;grid-template-columns:7rem minmax(0,1fr) 7rem;gap:var(--s2) var(--s3);
  align-items:baseline;padding:var(--s3) 0;border-top:1px solid var(--line)}
.wrow:last-of-type{border-bottom:1px solid var(--line)}
.wrow .sym{font:600 var(--t-body) var(--mono);color:var(--ink);letter-spacing:.02em}
.wrow .sym small{display:block;margin-top:3px;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim);font-weight:500}
.wrow .next{min-width:0;font-size:var(--t-body);color:var(--ink);line-height:1.45}
.wrow .next em{display:block;margin-top:var(--s1);font-style:normal;font-size:var(--t-data);color:var(--ink2)}
.wrow .next em b{color:var(--dn);font-weight:500}
.wrow .px{text-align:right;font-variant-numeric:tabular-nums}
.wrow .px b{font:600 var(--t-body) var(--mono);color:var(--ink)}
.wrow .px small{display:block;margin-top:3px;font-size:var(--t-label);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim)}

/* the three states share one bar so none of them can read as a signal */
.band{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin:var(--s5) 0 var(--s2)}
.band h3{margin:0;font:600 var(--t-h2)/1.2 var(--serif);letter-spacing:-.01em}
.band .n{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;
  border:1px solid var(--line2);border-radius:3px;padding:2px 7px;color:var(--dim)}
.band p{flex:1 1 100%;margin:0;font-size:var(--t-data);color:var(--dim);max-width:74ch}

/* sector context — expandable, never a recommendation */
.sect{border-top:1px solid var(--line)}
.sect:last-of-type{border-bottom:1px solid var(--line)}
.sect>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:2.5rem minmax(0,1fr) 5rem 6rem;
  gap:var(--s3);align-items:baseline;padding:var(--s2) 0}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.sect .rk{font:600 var(--t-body) var(--serif);color:var(--dim);font-variant-numeric:tabular-nums}
.sect.top .rk{color:var(--amber)}
.sect .nm{font-size:var(--t-body);color:var(--ink)}
.sect .nm small{color:var(--dim);font-size:var(--t-label);letter-spacing:var(--tr);margin-left:var(--s1)}
.sect .g,.sect .o{text-align:right;font-variant-numeric:tabular-nums;font:500 var(--t-data) var(--mono)}
.sect .o{color:var(--dim)}
.sect .in{padding:0 0 var(--s3) 2.5rem;font-size:var(--t-data);color:var(--ink2)}
.sect .in .hold{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s3);margin-top:var(--s1)}
.sect .in .hold span{white-space:nowrap}
.sect .in .hold b{color:var(--ink);font-weight:500}
.sect .in .hold .mine{color:var(--amber)}
@container (max-width:680px){
  .wrow{grid-template-columns:minmax(0,1fr) auto}
  .wrow .sym{grid-column:1;grid-row:1}
  .wrow .px{grid-column:2;grid-row:1}
  .wrow .next{grid-column:1/-1;grid-row:2}
  .sect>summary{grid-template-columns:2.5rem minmax(0,1fr) 5rem}
  .sect .o{display:none}
}

/* ── Setups ─────────────────────────────── */
.sgrp{margin-top:var(--s5)}
.sgrp>h3{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin:0 0 var(--s1);
  font:600 var(--t-h2)/1.2 var(--serif);letter-spacing:-.01em}
.sgrp>h3 .n{font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;
  border:1px solid var(--line2);border-radius:3px;padding:2px 7px;color:var(--dim)}
.sgrp>h3.on .n{color:var(--amber);border-color:var(--amber)}
.sgrp>p{margin:0 0 var(--s3);font-size:var(--t-data);color:var(--dim);max-width:74ch}
.su{border-top:1px solid var(--line)}
.su:last-of-type{border-bottom:1px solid var(--line)}
.su>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;
  gap:var(--s3);align-items:baseline;padding:var(--s3) 0}
.su>summary::-webkit-details-marker{display:none}
.su>summary:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.su>summary::after{content:'+';color:var(--dim)}
.su[open]>summary::after{content:'\2212'}
.su .k{font:700 var(--t-label) var(--mono);letter-spacing:var(--tr);text-align:center;
  border:1px solid var(--line2);border-radius:3px;padding:4px 0;color:var(--dim)}
.su.on .k{border-color:var(--amber);color:var(--amber)}
.su .t{font:600 var(--t-body) var(--serif);font-size:var(--t-h2);color:var(--ink);letter-spacing:-.01em}
.su .t small{display:block;margin-top:3px;font:400 var(--t-data) var(--mono);color:var(--dim);letter-spacing:0}
.su .in{padding:0 0 var(--s4) 2.6rem}
.su .size{margin:0 0 var(--s3);font:500 var(--t-data) var(--mono);color:var(--amber)}
.su h4{margin:var(--s3) 0 var(--s1);font:600 var(--t-label) var(--mono);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim)}
.su ol,.su ul{margin:0;padding-left:1.3em;font-size:var(--t-data);color:var(--ink2);line-height:1.7}
.su p{margin:0;font-size:var(--t-data);color:var(--ink2);line-height:1.7;max-width:74ch}
.su .two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s3)}
@container (max-width:680px){.su .two{grid-template-columns:1fr}.su .in{padding-left:0}}

/* ── Rules ─────────────────────────────── */
.filt{display:flex;flex-wrap:wrap;gap:var(--s1);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.filt button{appearance:none;cursor:pointer;background:none;border:1px solid var(--line2);border-radius:3px;
  padding:5px 10px;color:var(--dim);font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase}
.filt button[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
.filt button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.filt .sp{flex:1}
.rgrp{margin-top:var(--s5)}
.rgrp>h3{margin:0 0 var(--s2);font:600 var(--t-label) var(--mono);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:var(--s2)}
.rgrp>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.rc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s1) var(--s3);align-items:start;
  padding:var(--s3) 0;border-top:1px solid var(--line)}
.rc:last-of-type{border-bottom:1px solid var(--line)}
.rc .say{grid-column:1;font:500 var(--t-body)/1.4 var(--mono);color:var(--ink);margin:0}
.rc .why{grid-column:1;margin:0;font-size:var(--t-data);color:var(--ink2);max-width:72ch;line-height:1.65}
.rc .ev{grid-column:1;margin:var(--s1) 0 0;font-size:var(--t-data);color:var(--dim);line-height:1.65;max-width:72ch}
.rc .ev b{color:var(--ink2);font-weight:500}
.rc .st{grid-row:1/4;grid-column:2;align-self:start;white-space:nowrap;
  font:600 var(--t-label)/1 var(--mono);letter-spacing:var(--tr);text-transform:uppercase;
  border-radius:3px;padding:5px 9px;border:1px solid transparent}
.st.a{background:var(--amber);color:#17100a}
.st.w{border-color:var(--up);color:var(--up)}
.st.n{border-color:var(--dn);color:var(--dn)}
.st.d{border-color:var(--line2);color:var(--dim)}
.rc[hidden]{display:none}
@container (max-width:680px){.rc{grid-template-columns:1fr}.rc .st{grid-row:1;grid-column:1;justify-self:start}}

/* ── Sectors ─────────────────────────────── */
.lead{display:grid;grid-template-columns:2.6rem minmax(0,1fr) 5.5rem 5.5rem 6rem;gap:var(--s3);
  align-items:baseline;padding:var(--s2) 0;border-top:1px solid var(--line)}
.lead.hd{border-top:0;padding-bottom:var(--s1);font:600 var(--t-label) var(--mono);
  letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.sct{border-top:1px solid var(--line)}
.sct:last-of-type{border-bottom:1px solid var(--line)}
.sct>summary{cursor:pointer;list-style:none;display:grid;
  grid-template-columns:2.6rem minmax(0,1fr) 5.5rem 5.5rem 6rem;gap:var(--s3);
  align-items:baseline;padding:var(--s3) 0}
.sct>summary::-webkit-details-marker{display:none}
.sct>summary:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}
.sct:hover>summary{background:color-mix(in srgb,var(--amber) 4%,transparent)}
.sct .rk{font:600 var(--t-h2)/1 var(--serif);color:var(--dim);font-variant-numeric:tabular-nums}
.sct.top .rk{color:var(--amber)}
.sct .nm{font-size:var(--t-body);color:var(--ink);min-width:0}
.sct .nm small{display:block;margin-top:2px;font-size:var(--t-label);letter-spacing:var(--tr);color:var(--dim)}
.sct .num{text-align:right;font:500 var(--t-data) var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.sct .num.up{color:var(--up)}.sct .num.dn{color:var(--dn)}
.sct .spark{align-self:center}
.sct .spark svg{display:block;width:100%;height:22px;overflow:visible}
.sct .in{padding:0 0 var(--s4) 2.6rem}
.sct .in p{margin:0 0 var(--s2);font-size:var(--t-data);color:var(--ink2);line-height:1.65;max-width:74ch}
.hold{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s1) var(--s3);margin-top:var(--s2)}
.hold span{font:500 var(--t-data) var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;
  display:flex;justify-content:space-between;gap:var(--s2);border-bottom:1px solid var(--line);padding-bottom:3px}
.hold span.mine{color:var(--amber)}
.hold b{font-weight:600}
@container (max-width:680px){
  .lead,.sct>summary{grid-template-columns:2.2rem minmax(0,1fr) 4.5rem}
  .lead .spark,.sct .spark,.lead .o,.sct .o{display:none}
}

/* ── Methodology ─────────────────────────────── */
.mtoc{display:flex;flex-wrap:wrap;gap:var(--s1);padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.mtoc a{text-decoration:none;border:1px solid var(--line2);border-radius:3px;padding:5px 10px;
  color:var(--dim);font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase}
.mtoc a:hover,.mtoc a:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
.msec{padding-top:var(--s5);scroll-margin-top:var(--s4)}
.msec>h2{margin:0 0 var(--s2);font:600 var(--t-h2)/1.2 var(--serif);letter-spacing:-.01em}
.msec>p{margin:0 0 var(--s3);font-size:var(--t-data);color:var(--ink2);line-height:1.7;max-width:74ch}
.msec>p b{color:var(--ink);font-weight:500}
.dt{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:var(--s2) var(--s3);
  padding:var(--s2) 0;border-top:1px solid var(--line);font-size:var(--t-data)}
.dt:last-of-type{border-bottom:1px solid var(--line)}
.dt dt{font:500 var(--t-data) var(--mono);color:var(--ink);margin:0}
.dt dd{margin:0;color:var(--ink2);line-height:1.65}
.dt dd b{color:var(--ink);font-weight:500}
.warn2{border-left:2px solid var(--dn);padding:var(--s2) 0 var(--s2) var(--s3);margin:var(--s3) 0;
  font-size:var(--t-data);color:var(--ink2);line-height:1.7;max-width:74ch}
.warn2 b{color:var(--dn);font-weight:600}
.log{width:100%;border-collapse:collapse;font-size:var(--t-data);font-variant-numeric:tabular-nums}
.log th{text-align:left;padding:var(--s1) var(--s2) var(--s1) 0;border-bottom:1px solid var(--line2);
  font:600 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.log td{padding:var(--s2) var(--s2) var(--s2) 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.log td:first-child{color:var(--ink)}
.log .z{color:var(--dim)}
@container (max-width:680px){.dt{grid-template-columns:1fr}.dt dt{margin-top:var(--s2)}}

/* ── System ─────────────────────────────── */
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3);
  padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.big2>div{display:flex;flex-direction:column;gap:var(--s1)}
.big2 .l{font-size:var(--t-label);letter-spacing:var(--tr);text-transform:uppercase;color:var(--dim)}
.big2 .v{font:600 clamp(24px,3.4vw,32px)/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.big2 .v.ok{color:var(--up)} .big2 .v.bad{color:var(--dn)}
.big2 .n{font-size:var(--t-data);color:var(--ink2)}
.stat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:baseline;
  padding:var(--s3) 0;border-top:1px solid var(--line)}
.stat:last-of-type{border-bottom:1px solid var(--line)}
.stat .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);align-self:center}
.stat.ok .dot{background:var(--up)} .stat.bad .dot{background:var(--dn)} .stat.warn .dot{background:var(--amber)}
.stat .t{font-size:var(--t-body);color:var(--ink)}
.stat .t small{display:block;margin-top:3px;font-size:var(--t-data);color:var(--ink2);line-height:1.6}
.stat .r{text-align:right;font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);
  text-transform:uppercase;color:var(--dim);white-space:nowrap}
.stat.ok .r{color:var(--up)} .stat.bad .r{color:var(--dn)} .stat.warn .r{color:var(--amber)}
.acts{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.acts a{text-decoration:none;border:1px solid var(--line2);border-radius:4px;padding:9px 14px;
  color:var(--ink2);font:500 var(--t-label) var(--mono);letter-spacing:var(--tr);text-transform:uppercase}
.acts a.primary{border-color:var(--amber);color:var(--amber)}
.acts a:hover,.acts a:focus-visible{border-color:var(--amber);color:var(--amber);background:var(--panel);outline:none}
.errl{margin:var(--s2) 0 0;padding:var(--s2) var(--s3);border:1px solid var(--dn);border-left-width:3px;
  border-radius:5px;background:var(--panel);font-size:var(--t-data);color:var(--ink2);line-height:1.7}
.errl b{color:var(--dn)}
@container (max-width:680px){.stat{grid-template-columns:auto minmax(0,1fr)}.stat .r{grid-column:2;text-align:left}}
</style>
</head>
<body>
<div class="wrap">

  <div class="mast">
    <h1><b>Ledger</b></h1>
    <div class="stamp" id="stamp">loading…</div>
  </div>

  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-tab="today" aria-selected="true">Today<span class="n" id="n-today"></span></button>
    <button role="tab" data-tab="trades" aria-selected="false">Trades<span class="n" id="n-trades"></span></button>
    <button role="tab" data-tab="watching" aria-selected="false">Watching<span class="n" id="n-watching"></span></button>
    <button role="tab" data-tab="research" aria-selected="false">Research</button>
    <button role="tab" data-tab="system" aria-selected="false">System</button>
  </nav>

  <section role="tabpanel" id="tab-today" class="today"></section>
  <section role="tabpanel" id="tab-trades" class="today" hidden></section>
  <section role="tabpanel" id="tab-watching" class="today" hidden></section>

  <section role="tabpanel" id="tab-research" hidden>
    <div class="sub" role="tablist" aria-label="Research">
      <button role="tab" data-sub="setups" aria-selected="true">Setups</button>
      <button role="tab" data-sub="rules" aria-selected="false">Rules</button>
      <button role="tab" data-sub="sectors" aria-selected="false">Sectors</button>
      <button role="tab" data-sub="methodology" aria-selected="false">Methodology</button>
    </div>
    <div id="tab-setups" class="today"></div>
    <div id="tab-rules" class="today" hidden></div>
    <div id="tab-sectors" class="today" hidden></div>
    <div id="tab-methodology" class="today" hidden></div>
  </section>

  <section role="tabpanel" id="tab-system" class="today" hidden></section>
</div>

<script>
/* ══ Today ══════════════════════════════════ */
function todayTrades(d){
  const T=d.today||[]; if(!T.length) return '';
  return `<div class="sec"><h2>Trades of the day <span class="tag trade">written, not generated</span></h2>
    <p class="lede">Cost, breakeven, target and max loss were fixed when the trade was written. Stock price is live.
    Only rows showing odds have a tested hit rate.</p>`+
    T.map(r=>`<div class="row">
      <div class="sym">${esc(r.sym)}<small>${r.kind==='call'?'call':'shares'}</small></div>
      <div class="main"><div class="t">${esc(r.plain)}</div>
        <div class="miss">${esc(r.why)}</div>
        <div class="miss"><b style="color:var(--ink2)">Exit</b> ${esc(r.exit)}</div></div>
      <div class="num"><span class="big">${money(r.now)}</span>
        <span class="u">now · ${n0(r.cost)} to open</span>
        <span class="u up">+${n0(r.profit)} if it works</span></div>
    </div>`).join('')+`</div>`;
}

function fired(d){
  const out=[];
  if(d.vix_fires) out.push({sym:'QQQ',t:`Setup VIX fires. Buy an at-the-money QQQ call, about 30 days out, $1,000. Hold 21 sessions.`,num:f2(d.qqq),u:'QQQ now'});
  (d.F||[]).forEach(r=>out.push({sym:r.sym,t:`Setup F fires. Target ${money(r.tgt)}, the prior high. No stop.`,num:f2(r.px),u:`+${r.up.toFixed(1)}% to target`}));
  if(d.vix>=25)(d.S||[]).forEach(r=>out.push({sym:r.sym,t:`Setup S fires. Closed under its 20-day low with the 50 EMA under the 200.`,num:f2(r.px),u:`${r.below.toFixed(1)}% below`}));
  return out;
}

function renderToday(d,state){
  const A=$('#tab-today');

  if(state==='loading'){
    A.innerHTML=`<div class="tmast"><h1><b>Ledger</b> · today</h1><span class="when">loading…</span></div>
      <div class="verdict"><div class="eyebrow">the verdict</div>
        <div class="sk" style="height:46px;width:min(20ch,90%)"></div>
        <div class="sk" style="height:14px;width:min(40ch,95%);margin-top:20px"></div></div>
      <div class="ctx">${'<div><span class="l">&nbsp;</span><div class="sk" style="height:19px;width:70px"></div></div>'.repeat(3)}</div>`;
    return;
  }
  if(state==='error'){
    A.innerHTML=`<div class="tmast"><h1><b>Ledger</b> · today</h1><span class="when stale">no data</span></div>
      <div class="verdict"><div class="eyebrow">the verdict</div>
        <p class="say">Today is <b style="color:var(--dn)">unknown</b>.</p>
        <p class="vquiet">The page could not load <b>data.json</b>, so nothing below is current. This is not a quiet
        day — it is a page with no data. Do not read it as "nothing fires".</p></div>
      <div class="sec"><div class="err">HTTP 404 fetching data.json. The last scan may have failed to publish.
        Check the workflow run, then reload.</div></div>`;
    return;
  }

  const stale = state==='stale';
  const live  = fired(d);
  const blocked=d.blocked||[], watch=d.D||[], weekly=(d.weekly||[]).filter(r=>r.state==='crossed');
  const CAP=4;

  /* ── 1. verdict ─────────────────────────────────────────────────────────── */
  const say = live.length
    ? `<p class="say fires">${live.length===1?'One setup':live.length+' setups'} <b>fires</b> today.</p>`
    : `<p class="say">Nothing <b>fires</b> today.</p>`;

  /* `scanned` is how many names actually returned data; `universe` is how many were
     asked for. When they differ the line says so, because a flat "63 names" would be a
     claim the run did not earn. Older data.json files carry neither, so both optional. */
  const N = d.scanned ?? d.universe ?? null;
  const missed = (d.universe!=null && d.scanned!=null) ? d.universe - d.scanned : 0;
  const stat = `<div class="vstat"><span><b>6</b> setups checked</span><span>·</span>
    ${N!=null?`<span><b>${N}</b> name${N===1?'':'s'}${missed?` <span style="color:var(--dn)">of ${d.universe}</span>`:''}</span><span>·</span>`:''}
    <span><b>${live.length}</b> triggered</span></div>`;

  const quietLine = live.length
    ? `<p class="vquiet">A signal is a condition that was met, not a prediction. The $600 cap still applies.</p>`
    : `<p class="vquiet">Quiet is expected — roughly 3 signals arrive per month.${
        missed?` <b style="color:var(--dn)">${missed} name${missed===1?'':'s'} failed to fetch</b>, so the count is short.`:''}</p>`;

  const firedRows = live.length ? live.map(r=>`<div class="row">
      <div class="sym">${esc(r.sym)}</div>
      <div class="main"><div class="t">${r.t}</div></div>
      <div class="num"><span class="big">${r.num}</span><span class="u">${r.u}</span></div>
    </div>`).join('') : '';

  /* ── 3. getting close / watching, as a summary ──────────────────────────── */
  const nearRows = blocked.length ? blocked.slice(0,CAP).map(r=>`<div class="row tight">
      <div class="sym">${esc(r.sym)}</div>
      <div class="main"><div class="miss">missing <b>${esc(r.why)}</b></div></div>
      <div class="num"><span class="mid">${f2(r.px)}</span></div>
    </div>`).join('') + (blocked.length>CAP?`<p class="more">+${blocked.length-CAP} more · view all checks</p>`:'')
    : `<p class="empty">Nothing is one condition away.</p>`;

  const wRows=[
    ...watch.slice(0,CAP).map(r=>`<div class="row tight">
      <div class="sym">${esc(r.sym)}<small>setup D</small></div>

    </div>`)];
  const extra=(watch.length>CAP?watch.length-CAP:0)+(weekly.length>2?weekly.length-2:0);
  const watchRows = wRows.length
    ? wRows.join('')+(extra?`<p class="more">+${extra} more · view all checks</p>`:'')
    : `<p class="empty">Nothing on the watchlists.</p>`;

  /* ── 5. recent activity, from closed trades and the last five scans ─────── */
  const taken=(d.taken||[]).slice(-3).reverse();
  const days=((d.week&&d.week.days)||[]).slice(-5);
  const dayFired=x=>(x.F||[]).length+(x.vix_fires?1:0)+(x.vix>=25?(x.S||[]).length:0);
  const activity = (taken.length||days.length) ? `
    ${taken.map(t=>`<div class="row tight">
      <div class="sym">${esc(t.sym)}<small>${esc(t.closed||'')}</small></div>

    ${days.length?`<div class="week">${days.map(x=>{const n=dayFired(x);return `<div${n?' class="hit"':''}>

      <p class="more">the last ${days.length} scans · number of setups that fired</p>`:''}`
    : `<p class="empty">No closed trades yet.</p>`;

  /* ── 6. the checks ──────────────────────────────────────────────────────── */
  const check=(k,name,n,note)=>`<div class="chk"><span class="k">${k}</span>
    <span class="d"><b style="color:var(--ink)">${name}</b> — ${note}</span>
    <span class="r ${n?'yes':'no'}">${n?n+' fired':'none'}</span></div>`;

  A.innerHTML=`
  <div class="tmast">

    <span class="when${stale?' stale':''}">${stale?'data 3 days old · scan has not run':esc(d.date)+' · scanned '+esc(d.stamp)}</span>
  </div>

  <details class="whatis">

      <span class="how">How this works</span></summary>
    <div class="in">

      ${watchRows}
    </div>
  </div></div>

  ${todayTrades(d)}

  <div class="sec">
    <h2>Recent activity</h2>
    <p class="lede">Closed trades and what the scanner has seen this week.</p>
    ${activity}
  </div>

  <details class="deep">

    <div class="in">
      ${check('VIX','Setup VIX',d.vix_fires?1:0,'VIX 25+ in the last 10 sessions and falling 3 in a row. 10-day high '+d.vix_hi10.toFixed(1)+'.')}
      ${check('F','Setup F',(d.F||[]).length,'20–45% below the 252-day high, 10&gt;30, 50&gt;200, revenue +25% from SEC filings. Target is the prior high, no stop.')}

      ${(d.errors&&d.errors.length)?`<div class="chk"><span class="k">!</span>
        <span class="d">${d.errors.length} names failed to fetch: ${esc(d.errors.map(e=>String(e).split(':')[0]).join(', '))}</span>
        <span class="r no">incomplete</span></div>`:''}
      <p class="more" style="padding-top:var(--s3)">Three signals a month is the long-run rate, so nine days in ten

  not a quote. Every backtest behind this page carries a survivorship caveat.

/* State previews reshape real data. Nothing here invents a hit rate or a score.
   The one synthetic row is the 'fired' preview, and it is labelled at the top. */

/* ══ Trades ══════════════════════════════════ */
const KIND=r=>r.kind==='shares'?'shares':'call';
const RETIRED=new Set(['E']);

/* The rule that applies, read from fields the scanner already writes. Nothing here
   is invented: shares arm a floor at the target, calls have no stop by design. */
function ruleFor(r){
  if(r.kind==='shares'){
    return r.armed
      ? `Floor set at ${money(r.target)}. It closes only if it falls back there.`
      : `Reach ${money(r.target)}, then floor it there. Closes at 252 sessions if it never comes.`;
  }
  return r.dte!=null && r.dte<45
    ? `No stop. ${r.dte} days left — under the 45-day floor.`
    : `No stop. Target is the prior high.`;
}

function holding(r){
  const n=Number(r.contracts||1);
  if(r.kind==='shares'){
    const sh=Math.max(1,Math.round(600/Number(r.entry)));
    return `${sh} shares at ${money(r.entry)}`;
  }
  return `${n} ${esc(r.symbol)} ${r.strike} Call ${esc(String(r.expiry||'').slice(5))} at ${money(r.entry)}`;
}

function cost(r){
  const n=Number(r.contracts||1);
  return r.kind==='shares' ? Math.max(1,Math.round(600/Number(r.entry)))*Number(r.entry)
                           : Number(r.entry)*100*n;
}

function position(r){
  const up=Number(r.pl_pct)>=0, prog=Math.round((r.progress||0)*100);
  const mech=[
    ['entry', money(r.entry)],
    ['mark now, '+(r.mark||'model'), r.now!=null?money(r.now):'—'],
    ['cost basis', n0(cost(r))],
    r.kind==='call'?['strike / expiry', '$'+esc(r.strike)+' · '+esc(r.expiry)]:null,
    r.kind==='call'?['days left', r.dte!=null?r.dte+'d':'—']:null,
    r.kind==='call'?['contracts', esc(r.contracts||'1')]:null,
    r.kind==='shares'?['target', money(r.target)]:null,
    ['held', (r.sessions??'—')+' sessions'],
    ['opened', esc(r.opened)],
    ['account', esc(r.acct)],
  ].filter(Boolean);
  return `<details class="pos">
    <summary>
      <span class="sym">${esc(r.symbol)}
        <small>${r.acct==='real'?'<span class="real">real</span> ':''}${r.setup&&r.setup!=='none'
          ?`<span class="setup${RETIRED.has(r.setup)?' off':''}">${esc(r.setup)}${RETIRED.has(r.setup)?' · retired':''}</span>`
          :`<span class="setup off">no setup</span>`}</small></span>
      <span class="say">${holding(r)}
        <span class="rule">${ruleFor(r)}</span></span>
      <span class="pl"><b class="${up?'up':'dn'}">${pct(r.pl_pct)}</b>
        <small>${r.error?'quote failed':(r.mark||'model')}</small></span>
      <span class="st">${r.kind==='shares'&&!r.armed
          ? `<span class="bar"><i style="width:${Math.min(100,Math.max(0,prog))}%"></i></span>
             <small>${r.to_target!=null?pct(r.to_target)+' to target':''}</small>`
          : r.armed ? `<small class="up">floor set</small>`
          : `<small>${r.dte!=null?r.dte+'d left':''}</small>`}</span>
    </summary>
    <div class="mech">${mech.map(([l,v])=>`<div><span class="l">${l}</span><span class="v">${v}</span></div>`).join('')}</div>
  </details>`;
}

function closedRow(r){
  const up=Number(r.pl_pct)>=0;
  return `<div class="row tight">
    <div class="sym">${esc(r.symbol)}<small>${r.acct==='real'?'<span class="real">real</span>':esc(r.setup)}</small></div>
    <div class="main"><div class="t">${holding(r)} → ${money(r.exit)}</div>
      ${r.note?`<div class="miss">${esc(r.note)}</div>`:''}</div>
    <div class="num"><span class="mid ${up?'up':'dn'}">${pct(r.pl_pct)}</span>
      <span class="u">${esc(r.opened)} → ${esc(r.closed)}</span></div>
  </div>`;
}

  </div>

      <div class="num"><span class="big ${t.pl>=0?'up':'dn'}">${t.pl>=0?'+':'−'}${n0(t.pl)}</span>

    </div>`).join('')}
  </div>`:''}

  ${taken.filter(t=>t.link).length?`<div class="sec">

  <p class="foot">Prices: Yahoo Finance. Option marks tagged <b>schwab</b> or <b>alpaca</b> are a real bid/ask

/* ══ Watching ══════════════════════════════════ */
/* Every row is (symbol, what it is, the next condition, price). The next condition
   is read from the scanner's own fields. Where a thing can never become tradeable,
   the row says that instead of inventing a path. */
function wrow(sym,tag,what,next,px,unit){
  return `<div class="wrow">
    <div class="sym">${esc(sym)}<small>${tag}</small></div>
    <div class="next">${what}<em>${next}</em></div>
    <div class="px"><b>${f2(px)}</b><small>${unit||''}</small></div>
  </div>`;
}

function sector(s,open){
  const mine=new Set(s.ours||[]);
  const hold=(s.hold||[]).map(h=>`<span class="${mine.has(h.sym)?'mine':''}"><b>${esc(h.sym)}</b> ${h.pct.toFixed(1)}%</span>`).join('');
  return `<details class="sect${s.rank<=3?' top':''}"${open?' open':''}>
    <summary>
      <span class="rk">${s.rank}</span>
      <span class="nm">${esc(s.name)}<small>${esc(s.sym)}</small></span>
      <span class="g ${s.rel>0?'up':'dn'}">${pct(s.rel)}</span>
      <span class="o">${(s.ours||[]).length} of yours</span>
    </summary>
    <div class="in">
      <p style="margin:0">Rank ${s.rank} of 11 this week, ${s.d_week===0?'unchanged':(s.d_week>0?'up '+s.d_week:'down '+(-s.d_week))} on the week.
      ${pct(s.rel)} against the S&amp;P over the same window. ${s.churn?`Top ten holdings turned over ${esc(s.churn)}.`:''}</p>
      <div class="hold">${hold||'<span>holdings unavailable</span>'}</div>
      ${(s.ours||[]).length?`<p style="margin:var(--s2) 0 0">Yours in here: <b style="color:var(--amber)">${(s.ours||[]).join(', ')}</b></p>`:''}
    </div>
  </details>`;
}

function renderWatching(d,state){
  const A=$('#tab-watching');

  if(state==='loading'){
    A.innerHTML=`<div class="tmast"><h1><b>Ledger</b> · watching</h1><span class="when">loading…</span></div>
      ${'<div class="sk" style="height:52px;margin-top:14px"></div>'.repeat(6)}`;
    return;
  }
  if(state==='error'){
    A.innerHTML=`<div class="tmast"><h1><b>Ledger</b> · watching</h1><span class="when stale">no data</span></div>
      <div class="sec"><div class="err">HTTP 404 fetching data.json. Nothing can be listed. An empty
      watchlist would be wrong — this is missing data, not an empty list.</div></div>`;
    return;
  }

  const near=d.blocked||[], D=d.D||[], W=d.weekly||[];
  const crossed=W.filter(r=>r.state==='crossed'), soon=W.filter(r=>r.state!=='crossed');
  const S=d.sectors||[];
  const total=near.length+D.length+W.length;

  const nearRows = D.map(r=>wrow(r.sym,'setup D',
      `${r.dd.toFixed(1)}% below its high, RSI ${r.rsi.toFixed(0)}, up over 126 sessions.`,
      `Cannot become tradeable. <b>Setup D never beat random picking</b> on the honest universe.`,
      r.px,`+${r.up.toFixed(1)}% upside`)).join('');

  const blockedRows = near.map(r=>wrow(r.sym,'setup F band',
      `In the F price band, ${r.dd.toFixed(1)}% below its high.`,
      r.why==='no SEC data'
        ? `Needs <b>revenue from an SEC filing</b>. None is available for this name, so it cannot pass.`
        : `Needs the <b>trend to repair</b> — 10 over 30 and 50 over 200.`,
      r.px,`+${r.up.toFixed(1)}% to target`)).join('');

  const weeklyRows = [
    ...crossed.map(r=>wrow(r.sym,'crossed',
      `Weekly 10 EMA is above the 30. The 30 is ${r.up?'rising':'falling'}.`,
      r.up?`Already crossed. <b>Research only</b> — +0.49pp ex-top-five, p=0.363.`
          :`Crossed, but the 30 EMA is still <b>falling</b>. That is the weak version.`,
      r.px,`${pct(r.gap)} gap`)),
    ...soon.map(r=>wrow(r.sym,'near',
      `Weekly 10 EMA is ${Math.abs(r.gap).toFixed(1)}% under the 30.`,
      `Needs the <b>10 to cross the 30</b> on a weekly close.`,
      r.px,`${r.dd.toFixed(1)}% off high`))].join('');

  A.innerHTML=`

/* ══ Setups ══════════════════════════════════ */
const GROUP=[
  ["Tradeable","on","These produce signals I act on. F is the only one that survived every test.",["F","VIX","S"]],
  ["Watchlist only","","Shown, never acted on. Each failed a test that mattered, and the failure is printed below.",["D","C"]],
  ["Retired","","Superseded. Open positions still carry the tag, so it stays readable rather than deleted.",["E"]]];

function setup(k,d,on){
  const v=(d.setups||{})[k]; if(!v) return '';
  return `<details class="su${on?' on':''}">
    <summary>
      <span class="k">${esc(k==='VIX'?'VIX':k)}</span>
      <span class="t">${esc(v.name)}<small>${esc(v.tag)}</small></span>
    </summary>
    <div class="in">
      <p class="size">${esc(v.size)}</p>
      <h4>It fires when</h4>
      <ol>${v.rules.map(x=>`<li>${x}</li>`).join('')}</ol>
      <h4>The evidence</h4>
      <ul>${v.numbers.map(x=>`<li>${x}</li>`).join('')}</ul>
      <div class="two">
        <div><h4>When it works</h4><p>${v.works}</p></div>
        <div><h4>When it does not</h4><p>${v.fails}</p></div>
      </div>
    </div>
  </details>`;
}

/* ══ Sectors ══════════════════════════════════ */
function spark(track){
  /* rank 1 is best, so the scale is inverted. Eleven sectors, ten weeks. */
  const N=track.length, W=100, H=18;
  const X=i=>(i/(N-1))*W, Y=v=>1+((v-1)/10)*H;
  const pts=track.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last=track[track.length-1];
  return `<svg viewBox="-2 -2 ${W+8} ${H+4}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--dim)" stroke-width="1.5"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${X(N-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="2.2"
      fill="${last<=3?'var(--amber)':'var(--ink2)'}"/></svg>`;
}

function sector(s){
  const mine=new Set(s.ours||[]);
  const move=s.d_week===0?'held':(s.d_week>0?`up ${s.d_week}`:`down ${-s.d_week}`);
  return `<details class="sct${s.rank<=3?' top':''}">
    <summary>
      <span class="rk">${s.rank}</span>
      <span class="nm">${esc(s.name)}<small>${esc(s.sym)} · ${move} on the week</small></span>
      <span class="num ${s.rel>0?'up':'dn'}">${pct(s.rel)}</span>
      <span class="num o">${(s.ours||[]).length||'—'}</span>
      <span class="spark">${spark(s.track||[])}</span>
    </summary>
    <div class="in">
      <p>Rank <b style="color:var(--ink)">${s.rank} of 11</b>, ${move} on the week and
      ${s.d_month===0?'level':(s.d_month>0?'up '+s.d_month:'down '+(-s.d_month))} on the month.
      ${pct(s.rel)} against the S&amp;P. The fund is ${pct(s.gap)} from its own 200-day average.
      ${s.churn?`Top ten holdings turned over <b style="color:var(--ink)">${esc(s.churn)}</b>.`:''}</p>
      <div class="hold">${(s.hold||[]).map(h=>
        `<span class="${mine.has(h.sym)?'mine':''}"><b>${esc(h.sym)}</b>${h.pct.toFixed(1)}%</span>`).join('')
        || '<span>holdings unavailable</span>'}</div>
      ${(s.ours||[]).length?`<p style="margin-top:var(--s3)">Yours in here:
        <b style="color:var(--amber)">${(s.ours||[]).join(', ')}</b></p>`:

  </details>`;
}

    date. That distinction is the whole point: using the period date would let a backtest see a number weeks
    before it was public.</p>
    <dl class="dt"><dt>Field</dt><dd>Revenue only. Earnings per share breaks across splits and is not used.</dd></dl>
    <dl class="dt"><dt>Point in time</dt><dd>A filing is visible to the scanner only after its <b>filed</b>
      date, exactly as it was to the market.</dd></dl>
    <dl class="dt"><dt>Known gap</dt><dd>Some names return no usable SEC series. They are shown as
      <b>blocked: no SEC data</b> rather than quietly dropped.</dd></dl>
  </div>

  <div class="msec" id="m-marks"><h2>Option marks</h2>
    <p>An option price on this site is one of four things, and the row always says which.</p>
    <dl class="dt"><dt><b>schwab</b> / <b>alpaca</b></dt><dd>A <b>real bid/ask midpoint</b> from a live quote.
      This is the good case.</dd></dl>
    <dl class="dt"><dt><b>iv</b></dt><dd>Black-Scholes using implied volatility read from the option chain.
      A model, informed by the market.</dd></dl>
    <dl class="dt"><dt><b>est</b></dt><dd>Black-Scholes using 60-day realised volatility. A model with no
      market input. The weakest of the four.</dd></dl>
    <div class="warn2">A model price is <b>not a quote</b>. It ignores the spread, and on a wide spread the
    difference is larger than the edge being measured. Never size a position off an <b>est</b> mark.</div>
  </div>

  <div class="msec" id="m-backtests"><h2>Backtests</h2>
    <p>Every setup was written down before it was run. The bar a setup has to clear is not "it made money" —
    it is that the result survives having its five biggest contributors removed.</p>
    <dl class="dt"><dt>Baseline</dt><dd>Every bar in the same names over the same window. A setup is measured
      against that, not against zero.</dd></dl>
    <dl class="dt"><dt>Ex-top-five</dt><dd>The five names contributing most are dropped and the test is rerun.
      <b>Shuffling returns and then picking the top five beats the baseline 100% of the time on nothing.</b></dd></dl>
    <dl class="dt"><dt>Null model</dt><dd>2,000 random draws of the same size from the same pool, to see how
      often noise produces the same edge.</dd></dl>
    <dl class="dt"><dt>Era split</dt><dd>Results are split by period. A result that only exists in one era is
      not a result.</dd></dl>
    <dl class="dt"><dt>Look-ahead</dt><dd>Three look-ahead bugs have been found and fixed in this project.
      The signature is always the same: <b>results improve as the lookback gets shorter</b>.</dd></dl>
  </div>

  <div class="msec" id="m-survivorship"><h2>Survivorship</h2>
    <p>This is the largest known flaw on the site and it is not fixable with the current data.</p>
    <div class="warn2">The universe is <b>names that still trade today</b>. Companies that were delisted,
    acquired or went to zero are not in it. Every backtest result on this site is therefore
    <b>optimistic by an unknown amount</b>. Treat a positive result as an upper bound.</div>
    <p>The fix is a delisted-securities dataset with delisting returns. It has been priced and not bought.</p>
  </div>

  <div class="msec" id="m-stats"><h2>The statistics</h2>
    <dl class="dt"><dt>pp</dt><dd>Percentage points — the gap between two percentages. A setup at 58% against
      a 55% baseline is <b>+3pp</b>.</dd></dl>
    <dl class="dt"><dt>p-value</dt><dd>How often random draws produced an edge at least this large.
      <b>p = 0.363 means noise did it 36% of the time.</b> Low is good; this site treats anything above 0.05
      as not shown.</dd></dl>
    <dl class="dt"><dt>Median, not mean</dt><dd>Option returns are heavily skewed. A mean is dragged by one
      winner, so the median is quoted alongside it.</dd></dl>
    <dl class="dt"><dt>Sample size</dt><dd>A win rate over a handful of closed trades is a tally, not a
      probability. Counts are printed next to every rate on this site.</dd></dl>
  </div>

  <div class="msec" id="m-log"><h2>Scan record</h2>
    <p>One row per session the scan ran. Setup D is a watchlist count, not a signal.</p>
    ${days.length?`<div class="scroll"><table class="log"><thead><tr>
      <th>date</th><th>VIX</th><th>regime</th><th>VIX fires</th><th>F</th><th>C</th><th>S</th><th>D</th>
      </tr></thead><tbody>${days.map(r=>`<tr>
        <td>${esc(r.date)}</td><td>${Number(r.vix).toFixed(1)}</td><td>${esc(r.regime)}</td>
        <td class="${r.vix_fires?'':'z'}">${r.vix_fires?'yes':'no'}</td>
        <td class="${r.F.length?'':'z'}">${r.F.length?r.F.map(esc).join(' '):'—'}</td>
        <td class="${r.C.length?'':'z'}">${r.C.length?r.C.map(esc).join(' '):'—'}</td>
        <td class="${r.S.length?'':'z'}">${r.S.length?r.S.map(esc).join(' '):'—'}</td>
        <td class="z">${r.D.length}</td></tr>`).join('')}</tbody></table></div>`
      :`<p class="empty">History builds as the scan runs.</p>`}
    ${err?`<p class="more">${err} name${err===1?'':'s'} failed to fetch on the last run. See System.</p>`:''}
  </div>

  <p class="foot">If a number on this site has no source named here, treat it as unsourced and tell me.</p>`;
}

/* ══ System ══════════════════════════════════ */
const RUN='https://github.com/ArringtonC/stockcharter-scan/actions/workflows/daily.yml';

/* The workflow runs 13:15 and 21:15 UTC, Mon-Fri. Same arithmetic index.html uses. */
function nextRun(){
  const now=new Date(), SLOTS=[[13,15],[21,15]];
  for(let k=0;k<7;k++){
    const day=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()+k));
    if(day.getUTCDay()===0||day.getUTCDay()===6) continue;
    for(const [H,M] of SLOTS){
      const t=new Date(Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),H,M));
      if(t>now) return t;
    }
  }
  return null;
}
function ageHours(stamp){
  const m=String(stamp||'').match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  if(!m) return null;
  return (Date.now()-Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]))/3600000;
}
const human=h=>h==null?'—':h<1?`${Math.round(h*60)} min`:h<48?`${Math.round(h)} hr`:`${Math.round(h/24)} days`;

function renderSystem(d,state){
  const A=$('#tab-system');
  if(state==='loading'){
    A.innerHTML=`<div class="tmast"><h1><b>Ledger</b> · system</h1><span class="when">loading…</span></div>
      <div class="big2">${'<div><span class="l">&nbsp;</span><div class="sk" style="height:32px;width:110px"></div></div>'.repeat(3)}</div>`;
    return;
  }
  if(state==='error'){
    A.innerHTML=`<div class="tmast"><h1><b>Ledger</b> · system</h1><span class="when stale">page cannot load</span></div>
      <div class="sec">
        <div class="err">HTTP 404 fetching data.json. The scan has not published an output file, or the last
        run failed before writing one.</div>
        <div class="acts" style="margin-top:var(--s3)">
          <a class="primary" href="${RUN}" target="_blank" rel="noopener">Run the scan now ↗</a>
          <a href="${RUN}" target="_blank" rel="noopener">Last run log ↗</a>
        </div>
      </div>`;
    return;
  }

  const h=ageHours(d.stamp), next=nextRun();
  const stale=h!=null&&h>20, errs=d.errors||[];
  const mins=next?Math.round((next-Date.now())/60000):null;
  const when=mins==null?'—':mins<60?`${mins} min`:mins<1440?`${Math.round(mins/60)} hr`:`${Math.round(mins/1440)} d`;
  const marks=(d.open||[]).filter(r=>r.kind==='call');
  const real=marks.filter(r=>r.mark==='alpaca'||r.mark==='schwab').length;

  A.innerHTML=`
  <div class="tmast"><h1><b>Ledger</b> · system</h1>
    <span class="when${stale?' stale':''}">${stale?'stale':'healthy'}</span></div>

  <details class="whatis">
    <summary><span>Whether the scan ran, whether the data is current, and what broke.
      <b class="not">Nothing here is a trade.</b></span>
      <span class="how">How this works</span></summary>
    <div class="in">
      <p>The scan runs itself twice each weekday on a schedule. This page exists so a quiet day and a broken
      job never look the same.</p>
    </div>
  </details>

  <div class="big2">
    <div><span class="l">last successful scan</span>
      <span class="v ${stale?'bad':'ok'}">${human(h)} ago</span>
      <span class="n">${esc(d.stamp||'—')}</span></div>
    <div><span class="l">next scheduled run</span>
      <span class="v">${when}</span>
      <span class="n">${next?next.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'—'} your time</span></div>
    <div><span class="l">fetch errors</span>
      <span class="v ${errs.length?'bad':'ok'}">${errs.length}</span>
      <span class="n">${errs.length?'names failed':'all names returned'}</span></div>
  </div>

  ${stale?`<div class="stalebar" style="margin-top:var(--s3)"><b>The data is ${human(h)} old.</b> A scheduled
    run has not published. Everything on Today and Trades is from the last good run, not from now.</div>`:''}

  <div class="sec">
    <h2>Status</h2>
    <p class="lede">Each check, and what it means if it is failing.</p>

    <div class="stat ${stale?'bad':'ok'}"><span class="dot"></span>
      <span class="t">Scheduled scan
        <small>Runs 13:15 and 21:15 UTC, Monday to Friday. Last output written ${esc(d.stamp||'—')}.</small></span>
      <span class="r">${stale?'stale':'on time'}</span></div>

    <div class="stat ${errs.length?'warn':'ok'}"><span class="dot"></span>
      <span class="t">Price fetch
        <small>${errs.length?'Some names did not return. Their setups could not be evaluated this run.'
          :'Every name in the universe returned daily bars.'}</small></span>
      <span class="r">${errs.length?errs.length+' failed':'complete'}</span></div>
    ${errs.length?`<div class="errl"><b>Failed:</b> ${esc(errs.map(e=>String(e).split(':')[0]).join(', '))}</div>`:''}

    <div class="stat ${marks.length&&real===marks.length?'ok':marks.length&&real?'warn':''}"><span class="dot"></span>
      <span class="t">Option quotes
        <small>${real}/${marks.length} open calls marked at a real bid/ask. The rest fall back to
        Black-Scholes, which is a model, not a quote.</small></span>
      <span class="r">${marks.length?(real===marks.length?'live quotes':real+' of '+marks.length):'no calls open'}</span></div>

    <div class="stat ok"><span class="dot"></span>
      <span class="t">Published page
        <small>Served from the repository, cached for 10 minutes. A change you just pushed can take that long
        to appear.</small></span>
      <span class="r">serving</span></div>
  </div>

  <div class="sec">
    <h2>Actions</h2>
    <p class="lede">Manual controls. These live here and nowhere else on the site.</p>
    <div class="acts">
      <a class="primary" href="${RUN}" target="_blank" rel="noopener">Run the scan now ↗</a>
      <a href="${RUN}" target="_blank" rel="noopener">Run history ↗</a>
      <a href="https://github.com/ArringtonC/stockcharter-scan" target="_blank" rel="noopener">Repository ↗</a>
      <a href="../data.json" target="_blank" rel="noopener">Raw scan output ↗</a>
    </div>
    <p class="more">A manual run takes about a minute and overwrites the current output. It cannot place a
    trade — the scanner has no broker connection and never has.</p>
  </div>

  <p class="foot">Scan schedule and run logs: repository actions. Nothing on this page affects a position.</p>`;
}


/* ── helpers, shared by every renderer ─────────────────────────────────────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=x=>Number(x).toFixed(2);
const pct=(x,sign=true)=>x==null?'—':(sign&&Number(x)>0?'+':'')+Number(x).toFixed(1)+'%';
const money=x=>'$'+Number(x).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const n0=x=>'$'+Math.round(Math.abs(x)).toLocaleString();

/* ── navigation ────────────────────────────────────────────────────────────── */
const PANELS=['today','trades','watching','research','system'];
function show(tab){
  document.querySelectorAll('nav [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  PANELS.forEach(p=>$('#tab-'+p).hidden=p!==tab);
  try{localStorage.setItem('tab',tab)}catch(e){}
}
document.querySelectorAll('nav [role=tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));

const SUBS=['setups','rules','sectors','methodology'];
function showSub(s){
  document.querySelectorAll('.sub [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.sub===s));
  SUBS.forEach(p=>$('#tab-'+p).hidden=p!==s);
  try{localStorage.setItem('sub',s)}catch(e){}
}
document.querySelectorAll('.sub [role=tab]').forEach(b=>b.addEventListener('click',()=>showSub(b.dataset.sub)));

/* ── boot ──────────────────────────────────────────────────────────────────── */
function renderAll(d,state){
  renderToday(d,state); renderTrades(d,state); renderWatching(d,state);
  renderSetups(d,state); renderRules(d,state); renderSectors(d,state);
  renderMethodology(d,state); renderSystem(d,state);
  if(state==='error'){ $('#stamp').textContent='could not load data.json'; $('#stamp').classList.add('stale'); return; }
  const live=(d.F||[]).length+(d.vix_fires?1:0)+(d.vix>=25?(d.S||[]).length:0);
  $('#n-today').textContent=live;
  $('#n-trades').textContent=(d.open||[]).length;
  $('#n-watching').textContent=(d.blocked||[]).length+(d.D||[]).length+(d.weekly||[]).length;
  const m=String(d.stamp||'').match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  let age='';
  if(m){
    const h=(Date.now()-Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]))/3600000;
    age = h<1?`${Math.round(h*60)} min old` : h<48?`${Math.round(h)} hr old` : `${Math.round(h/24)} days old`;
    if(h>20) $('#stamp').classList.add('stale');
  }
  $('#stamp').innerHTML=`${esc(d.date)} · data <b>${age}</b>`;
}

renderAll({},'loading');
fetch('data.json?'+Date.now())
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(d=>{
    renderAll(d,'live');
    let t='today',s='setups';
    try{t=localStorage.getItem('tab')||'today';s=localStorage.getItem('sub')||'setups'}catch(e){}
    show(PANELS.includes(t)?t:'today'); showSub(SUBS.includes(s)?s:'setups');
  })
  .catch(()=>renderAll({},'error'));
</script>
</body>
